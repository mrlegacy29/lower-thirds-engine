  function statLine(label,id,val){ return el("div",{class:"row",style:"justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--muted)"},
    [el("span",{text:label}),el("b",{id:id,text:val,style:"color:var(--ink)"})]); }

  /* ---- live data sources ----
     Bound values become {{name}} placeholders usable in ANY operator-typed text —
     a QR link, a clock label, a bullet list, a manual verse. */
  const cslDataFeed=createDataFeed((v,st)=>{ pvStage.setVars(v); pgStage.setVars(v); paintDataStatus(v,st); });
  let _cslDataSig="";
  function dataOf(){ if(!preview.data||typeof preview.data!=="object")preview.data={sources:[]};
    if(!Array.isArray(preview.data.sources))preview.data.sources=[]; return preview.data; }
  function refreshDataFeed(){
    const sig=JSON.stringify(dataOf().sources);
    if(sig===_cslDataSig)return;                 // don't restart polling on unrelated edits
    _cslDataSig=sig; cslDataFeed.setSources(dataOf().sources);
  }
  function paintDataStatus(vars,st){
    const n=$("dataVars"); if(!n)return;
    n.innerHTML="";
    // Show namespaced names too (source.key). Filtering them out hid half the usable
    // placeholders — exactly the ones you need when two sources share a key.
    const keys=Object.keys(vars||{}).sort();
    if(!keys.length){ n.append(el("p",{class:"hint",text:"No values yet."})); return; }
    const box=el("div",{style:"font-size:11px;font-family:var(--mono,monospace);line-height:1.7"});
    keys.slice(0,24).forEach(k=>{
      const row=el("div");
      const key=el("b",{style:"color:var(--ink)"}); key.append(document.createTextNode("{{"+k+"}}"));
      const val=el("span",{style:"color:var(--muted)"}); val.append(document.createTextNode("  =  "+String(vars[k]).slice(0,48)));
      row.append(key,val); box.append(row);
    });
    n.append(box);
    n.append(el("p",{class:"hint",text:"Paste a placeholder into any text field — captions, verses, QR links, bullet lists."}));
  }
  function secData(){
    const d=dataOf();
    const wrap=el("div");
    if(!d.sources.length) wrap.append(el("div",{class:"empty",text:"No sources. Add one to pull live values into your graphics."}));
    d.sources.forEach((s,i)=>{
      const card=el("div",{class:"grp",style:"padding:8px 10px"});
      const head=el("div",{class:"row",style:"justify-content:space-between;align-items:center"});
      const onOff=el("input",{type:"checkbox"}); onOff.checked=s.enabled!==false;
      onOff.onchange=()=>{s.enabled=onOff.checked;savePreview();refreshDataFeed();};
      const lbl=el("label",{style:"display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)"});
      lbl.append(onOff,document.createTextNode("Source "+(i+1)));
      head.append(lbl,iconBtn("trash","Remove source",()=>{d.sources.splice(i,1);savePreview();refreshDataFeed();renderPanels();},"danger"));
      card.append(head);
      card.append(rowText("Name (optional prefix)",s.name,(v)=>{s.name=v;savePreview();refreshDataFeed();},"e.g. giving"));
      card.append(rowText("URL",s.url,(v)=>{s.url=v;savePreview();refreshDataFeed();},"https://docs.google.com/…/pub?output=csv"));
      card.append(rowSelect("Format",s.kind||"csv",[["csv","CSV / Google Sheet"],["json","JSON"],["text","Plain text"]],
        (v)=>{s.kind=v;savePreview();refreshDataFeed();renderPanels();}));
      if((s.kind||"csv")==="json")
        card.append(rowText("Path into the JSON (optional)",s.pick,(v)=>{s.pick=v;savePreview();refreshDataFeed();},"e.g. data.totals"));
      if((s.kind||"csv")==="csv"){
        card.append(rowSelect("Sheet layout",s.layout||"pairs",
          [["pairs","Name,value on each row"],["table","Header row, values on row 2"]],
          (v)=>{s.layout=v;savePreview();refreshDataFeed();}));
        card.append(el("p",{class:"hint",html:"A two-column sheet is ambiguous, so pick what matches. <b>Name,value</b>: <i>offering,$12450</i> on each row. <b>Header row</b>: names across the top, values underneath."}));
      }
      card.append(rowRange("Refresh every (seconds)",Math.max(5,Number(s.interval)||60),5,600,5,"s",(v)=>{s.interval=v;savePreview();refreshDataFeed();}));
      const st=(cslDataFeed.status()||{})[s.id];
      if(st){
        const line=el("p",{class:"hint",style:"color:"+(st.ok?"#8ef0b8":"#ff9d96")});
        line.append(document.createTextNode((st.ok?"✓ ":"✕ ")+st.msg));
        card.append(line);
      }
      wrap.append(card);
    });
    const actions=el("div",{class:"row",style:"gap:8px;flex-wrap:wrap"},[
      el("button",{class:"btn sm",html:svg("plus")+" Add source",onclick:()=>{
        d.sources.push({id:uid(),enabled:true,name:"",url:"",kind:"csv",interval:60});
        savePreview();renderPanels();}}),
      el("button",{class:"btn ghost sm",text:"Refresh now",onclick:()=>cslDataFeed.refresh()})
    ]);
    const vars=el("div",{class:"grp"},[el("div",{class:"gh",text:"Available placeholders"}),el("div",{id:"dataVars"})]);
    setTimeout(()=>paintDataStatus(cslDataFeed.vars(),cslDataFeed.status()),0);
    const note=el("p",{class:"hint",html:"For a <b>Google Sheet</b>: File → Share → Publish to web → CSV. Two columns (<i>name,value</i>) become named placeholders; otherwise the header row names them. A source that fails keeps the last good values rather than blanking a graphic."});
    return section("Live data",[wrap,actions,vars,note],false,"data");
  }

  /* ---- automation rules ----
     "While the live slide matches ___, show/hide ___." A rule takes full control
     of its target while enabled, and every rule releases its target on a clear. */
  function rulesOf(){ if(!Array.isArray(preview.rules))preview.rules=[]; return preview.rules; }
  function secRules(){
    const rules=rulesOf();
    const targets=(preview.elements||[]).filter(Boolean).map(e=>[e.id,e.name||TYPE_LABELS[e.type]||e.type]);
    const wrap=el("div");

    if(!rules.length) wrap.append(el("div",{class:"empty",text:"No rules. Add one to switch elements automatically as slides change."}));

    rules.forEach((r,i)=>{
      const card=el("div",{class:"grp",style:"padding:8px 10px"});
      const head=el("div",{class:"row",style:"justify-content:space-between;align-items:center;gap:8px"});
      const onOff=el("input",{type:"checkbox"}); onOff.checked=r.enabled!==false;
      onOff.onchange=()=>{r.enabled=onOff.checked;applyPreview();};
      const lbl=el("label",{style:"display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)"});
      lbl.append(onOff,document.createTextNode("Rule "+(i+1)));
      head.append(lbl,iconBtn("trash","Delete rule",()=>{rules.splice(i,1);applyPreview();renderPanels();},"danger"));
      card.append(head);

      card.append(rowSelect("When the live",r.on||"text",[["text","Slide text"],["ref","Scripture reference"]],
        (v)=>{r.on=v;applyPreview();}));
      card.append(rowSelect("…",r.match||"contains",[["contains","contains"],["regex","matches (regex)"],["any","is anything (always on)"]],
        (v)=>{r.match=v;applyPreview();renderPanels();}));
      if((r.match||"contains")!=="any")
        card.append(rowText("Pattern",r.pattern,(v)=>{r.pattern=v;applyPreview();},
          (r.match==="regex")?"e.g. ^Announcements":"e.g. Welcome"));
      card.append(rowSelect("Then",r.act||"show",[["show","SHOW this element"],["hide","HIDE this element"]],
        (v)=>{r.act=v;applyPreview();}));
      if(targets.length)
        card.append(rowSelect("Element",r.target||targets[0][0],targets,(v)=>{r.target=v;applyPreview();}));
      else
        card.append(el("p",{class:"hint",text:"Add an element first — a rule needs something to control."}));

      const t=(targets.find(x=>x[0]===r.target)||[])[1];
      card.append(el("p",{class:"hint",html:"While the "+( (r.on==="ref")?"reference":"slide text")+" "+
        ((r.match==="any")?"is anything":((r.match==="regex")?"matches ":"contains ")+"<b>"+escapeHtml(r.pattern||"…")+"</b>")+
        ", <b>"+((r.act==="hide")?"hide":"show")+"</b> "+escapeHtml(t||"(pick an element)")+
        " — and do the opposite when it doesn't."}));
      wrap.append(card);
    });

    const add=el("div",{class:"row"},[
      el("button",{class:"btn sm full",html:svg("plus")+" Add rule",onclick:()=>{
        rules.push({id:uid(),enabled:true,on:"text",match:"contains",pattern:"",act:"show",
                    target:(preview.elements[0]||{}).id||null});
        applyPreview();renderPanels();}})
    ]);
    const note=el("p",{class:"hint",html:"Rules run off the <b>live ProPresenter feed</b>, so elements switch themselves as the service moves. A rule fully controls its element while enabled, and releases it on a clear. Changes reach OBS after the next <b>TAKE</b>."});
    return section("Automation rules",[wrap,add,note],false,"rules");
  }

  /* ---- brand theme ----
     Tokens let one change restyle the whole package. An element style can hold
     "@accent" / "@display" instead of a literal, and resolveTok() turns it into
     the theme value at render time. Literals still work, so nothing has to be
     migrated — "Apply theme to all elements" is what opts an existing look in. */
  const THEME_FONTS=[["'Oswald','Arial Narrow',sans-serif","Oswald (condensed)"],["'Bebas Neue',sans-serif","Bebas Neue"],
    ["'Barlow Condensed',sans-serif","Barlow Condensed"],["Georgia,'Times New Roman',serif","Georgia (serif)"],
    ["'Helvetica Neue',Arial,sans-serif","Helvetica / Arial"],["'Libre Franklin',sans-serif","Libre Franklin"],
    ["'Trebuchet MS',sans-serif","Trebuchet"],["Impact,sans-serif","Impact"],["Verdana,sans-serif","Verdana"]];

  // Which style bucket of each type gets which token. Headline text takes the ink
  // colour and the display face; supporting text (references, roles, labels) takes
  // the accent. This is what makes one theme read as a coherent package.
  const THEME_MAP={
    scripture:{ref:{color:"@accent",font:"@display"}, body:{color:"@ink",font:"@body"}},
    reference:{ref:{color:"@accent",font:"@display"}},
    name:{name:{color:"@ink",font:"@display"}, title:{color:"@accent",font:"@body"}},
    // sub takes @muted: a subtitle IS secondary text, and this gives the Muted swatch
    // something to actually control — nothing pointed at it before, so the colour
    // picker was a no-op.
    sermonTitle:{title:{color:"@ink",font:"@display"}, sub:{color:"@muted",font:"@body"}},
    text:{text:{color:"@ink",font:"@body"}},
    bulletList:{heading:{color:"@accent",font:"@display"}, item:{color:"@ink",font:"@body"}},
    history:{heading:{color:"@accent",font:"@display"}, item:{color:"@ink",font:"@body"}},
    eventList:{heading:{color:"@accent",font:"@display"}, item:{color:"@ink",font:"@body"}},
    clock:{label:{color:"@accent",font:"@display"}, time:{color:"@ink",font:"@display"}}
  };
  function applyThemeToAll(){
    let n=0;
    (preview.elements||[]).forEach(d=>{
      if(!d)return;
      const map=THEME_MAP[d.type]; if(!map)return;
      Object.keys(map).forEach(bucket=>{
        if(!d.style||!d.style[bucket])return;
        Object.assign(d.style[bucket],map[bucket]); n++;
      });
      if(d.accentColor!==undefined) d.accentColor="@accent";
      if(d.chipBg!==undefined) d.chipBg="@panel";
    });
    applyPreview(); renderPanels();
    return n;
  }
  function themeOf(){ if(!preview.theme)preview.theme=defaultTheme(); return preview.theme; }

  function secTheme(){
    const th=themeOf();
    const colorRow=(key,label,hint)=>el("div",null,[
      rowColor(label,resolveTok("@"+key,th),(v)=>{th[key]=v;applyPreview();}),
      hint?el("p",{class:"hint",text:hint}):null
    ]);
    return section("Brand theme",[
      el("p",{class:"hint",html:"Set your brand once. Any element style can point at a token (<b>@accent</b>, <b>@ink</b>, <b>@display</b>…) instead of a fixed value, so changing it here restyles everything that uses it."}),
      colorRow("accent","Accent","References, role labels, bars — the brand colour."),
      colorRow("ink","Text","Primary text: verse bodies, names, titles."),
      colorRow("muted","Muted","Secondary text."),
      colorRow("panel","Panel fill","Chip and panel backgrounds."),
      rowSelect("Display font",th.display,THEME_FONTS,(v)=>{th.display=v;applyPreview();}),
      rowSelect("Body font",th.body,THEME_FONTS,(v)=>{th.body=v;applyPreview();}),
      el("div",{class:"row"},[
        el("button",{class:"btn primary full",text:"Apply theme to all elements",
          title:"Repoint every element's colours and fonts at the tokens above",
          onclick:()=>{ if(confirm("Repoint every element's colours and fonts at the theme tokens?\n\nThis overwrites per-element colour/font choices in Preview. Your presets are untouched, and nothing reaches air until you press TAKE."))
            { const n=applyThemeToAll(); alert("Themed "+n+" style group"+(n===1?"":"s")+".\n\nPress TAKE to send it live."); } }})
      ]),
      el("div",{class:"row"},[
        el("button",{class:"btn sm full",text:"Reset theme to defaults",
          onclick:()=>{ preview.theme=defaultTheme(); applyPreview(); renderPanels(); }})
      ])
    ],false,"theme");
  }

  /* ---- output ---- */
  function secOutput(){
    return section("Output & keying",[
      rowSeg("Background",preview.out.bg,[["transparent","Transparent"],["green","Chroma green"],["black","Black"]],(v)=>{preview.out.bg=v;applyPreview();}),

  /* ---- destination 1: OBS Browser Source ----
     Always available and always on — the relay serves /output whether or not any
     SDI hardware exists. This lamp answers "is OBS actually attached?", which the
     relay can genuinely tell us: it counts live SSE subscribers. */
  let obsPoll=null;
  function obsGroup(){
    const stat=el("div",{id:"obsStat"});
    const box=el("div",{class:"grp",id:"obsGrp"},[
      el("div",{class:"gh",text:"OBS Browser Source"}),
      stat,
      el("p",{class:"hint",html:"Add a <b>Browser</b> source in OBS at the URL in the top bar, 1920&times;1080, and turn <b>OFF</b> “Shutdown source when not visible”."})
    ]);
    startObsPoll(stat);
    return box;
  }
  // Holds the node itself rather than looking it up by id, and defers the first
  // tick: obsGroup() runs while the panel is still being BUILT, so at that moment
  // the node isn't in the document yet and an id lookup would come back empty.
  function startObsPoll(node){
    if(obsPoll){ clearInterval(obsPoll); obsPoll=null; }   // never stack timers across re-renders
    const tick=async()=>{
      if(!node || !node.isConnected){ clearInterval(obsPoll); obsPoll=null; return; }  // panel rebuilt
      let s=null;
      if(SERVED){ try{ const r=await fetch(relayBase()+"/status",{cache:"no-store"}); if(r.ok) s=await r.json(); }catch(e){} }
      paintObsStatus(s,node);
    };
    obsPoll=setInterval(tick,2000);
    setTimeout(tick,0);            // after the group is appended
  }
  function paintObsStatus(s,node){
    const n=node||$("obsStat"); if(!n)return;
    n.innerHTML="";
    const lamp=(c)=>el("span",{style:"width:11px;height:11px;border-radius:50%;flex:0 0 auto;background:"+c+";box-shadow:0 0 10px "+c});
    let col,head,sub;
    if(!SERVED){
      col=SDI_LAMP.amber; head="FILE MODE"; sub="Opened straight from disk — use the Baked URL, or run the desktop app / relay for live updates.";
    } else if(!s){
      col=SDI_LAMP.red; head="RELAY UNREACHABLE"; sub="The local server isn't answering. Restart the app.";
    } else if(!s.clients){
      col=SDI_LAMP.red; head="NO OUTPUT CONNECTED"; sub="Nothing is subscribed yet — add the Browser source in OBS (or open the output in a browser to test).";
    } else {
      col=SDI_LAMP.green; head="OBS CONNECTED"; sub=s.clients+" output"+(s.clients===1?"":"s")+" subscribed"+(s.hasProgram?" · program loaded":" · press TAKE to send a look");
    }
    const pill=el("div",{style:"display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:10px;"+
      "background:"+col.bg+";border:1px solid "+col.bd});
    pill.append(lamp(col.dot));
    const t=el("div",{style:"font-size:12px;font-weight:700;color:"+col.ink}); t.append(document.createTextNode(head));
    const d=el("div",{style:"font-size:11px;color:var(--muted);margin-top:1px"}); d.append(document.createTextNode(sub));
    const colw=el("div",{style:"min-width:0"}); colw.append(t,d);
    pill.append(colw); n.append(pill);
  }

  /* ---- SDI fill + key (DeckLink) ----
     Desktop app only: it drives the card from the Electron main process. In a
     plain browser / OBS there is no window.ltDesktop, so the whole group is
     omitted and lt.html keeps working as a standalone file.
     Settings live in their OWN localStorage key, deliberately NOT in the config:
     the card and video mode are per-machine plumbing, so they must not travel in
     a Take or make the TAKE button read "pending". */
  const LS_SDI="pplt.sdi.v1";
  const SDI_DEF={deviceIndex:0,mode:"bmdModeHD1080p5994",level:255};
  function sdiCfg(){ return lsGet(LS_SDI,SDI_DEF); }
  function saveSdiCfg(c){ lsSet(LS_SDI,c); }
  function hasSdi(){ return !!(window.ltDesktop && window.ltDesktop.sdi); }

  function sdiGroup(){
    if(!hasSdi()) return null;
    // subscribe once: main pushes a status heartbeat (~2s) plus faults
    if(!sdiGroup._sub){ sdiGroup._sub=true; try{ window.ltDesktop.sdi.onStatus(paintSdiStatus); }catch(e){} }
    const box=el("div",{class:"grp",id:"sdiGrp"},[
      el("div",{class:"gh",text:"SDI fill + key — DeckLink → ATEM"}),
      el("div",{id:"sdiBody"},[el("p",{class:"hint",text:"Checking for a DeckLink…"})])
    ]);
    setTimeout(renderSdiPanel,0);   // async: device + mode lists come over IPC
    return box;
  }

  async function renderSdiPanel(){
    const body=$("sdiBody"); if(!body||!hasSdi())return;
    const api=window.ltDesktop.sdi;
    let st={},modes=[],devs=[];
    try{ st=await api.status()||{}; }catch(e){ st={supported:false,reason:String(e&&e.message||e)}; }
    if(st.supported){ try{ modes=await api.modes()||[]; }catch(e){} try{ devs=await api.devices()||[]; }catch(e){} }
    body.innerHTML="";

    if(!st.supported){
      body.append(el("p",{class:"hint",html:"<b>Not available on this machine.</b>"}));
      body.append(el("pre",{style:"white-space:pre-wrap;font-size:11px;line-height:1.5;color:var(--muted);margin:6px 0 0",text:st.reason||"Unknown reason."}));
      body.append(el("p",{class:"hint",html:"Until then, OBS can drive the card: add a Browser source pointing at the output URL, set <b>Settings → Advanced → Color Format = RGB</b>, then <b>Tools → DeckLink Output</b> with <b>Keyer = External</b>."}));
      return;
    }

    const cfg=sdiCfg();
    if(devs.length){
      body.append(rowSelect("DeckLink device",String(cfg.deviceIndex),
        devs.map(d=>[String(d.index),d.display]),(v)=>{const c=sdiCfg();c.deviceIndex=parseInt(v)||0;saveSdiCfg(c);}));
    } else {
      body.append(el("p",{class:"hint",html:"<b>No DeckLink found.</b> Check Blackmagic Desktop Video Setup, and that the card is mapped for keying."}));
    }
    body.append(rowSelect("Video mode",cfg.mode,modes.map(m=>[m.id,m.label]),(v)=>{const c=sdiCfg();c.mode=v;saveSdiCfg(c);}));
    body.append(el("p",{class:"hint",html:"⚠️ Must match the ATEM <b>exactly</b> — a mismatch shows up as flicker or black."}));
    body.append(rowRange("Key level",cfg.level,0,255,1,"",(v)=>{const c=sdiCfg();c.level=v;saveSdiCfg(c);if(window.ltDesktop.sdi)window.ltDesktop.sdi.setLevel(v);}));

    const btn=el("button",{class:"btn full "+(st.on?"":"primary"),text:st.on?"Stop SDI output":"Start SDI output",
      onclick:async()=>{ btn.disabled=true;
        try{ const c=sdiCfg();
          const s=st.on? await api.stop() : await api.start({deviceIndex:c.deviceIndex,mode:c.mode,level:c.level});
          paintSdiStatus(s);
        }catch(e){}
        btn.disabled=false; renderSdiPanel(); } });
    const tbtn=el("button",{class:"btn sm full",text:"Send test pattern (10s)",disabled:!st.on,
      onclick:async()=>{ tbtn.disabled=true; const o=tbtn.textContent; tbtn.textContent="Test card on air…";
        try{ paintSdiStatus(await api.test(10)); }catch(e){}
        tbtn.textContent=o; tbtn.disabled=!st.on; renderSdiPanel(); } });
    body.append(el("div",{class:"row"},[btn]));
    body.append(el("div",{class:"row"},[tbtn]));
    body.append(el("p",{class:"hint",html:"The test card shows colour bars with a <b>transparent centre box</b>. On the ATEM multiview the <b>fill</b> input shows the bars in colour and the <b>key</b> input shows a white silhouette on black — that tells you instantly if the two SDI cables are swapped."}));
    body.append(el("div",{id:"sdiStat",style:"margin-top:6px"}));
    paintSdiStatus(st);

    body.append(el("p",{class:"hint",html:"On the ATEM keyer: <b>Key Type = Luma</b>, <b>Pre-Multiplied Key ON</b>, Fill + Key sources set to the two SDI inputs from the card."}));
    body.append(el("p",{class:"hint",html:"The card output is <b>exclusive</b> — if ProPresenter's alpha keyer already holds it, stop that first or use a second card."}));
  }

  // Built with DOM nodes, never innerHTML: the fault strings come back from the
  // Blackmagic driver, and esc() lives in the renderer scope and isn't reachable
  // here. textContent is both correct and immune to markup in those messages.
  const SDI_LAMP={green:{bg:"#0f3222",bd:"#2f7d55",dot:"#36d07a",ink:"#8ef0b8"},
                  amber:{bg:"#3a2c0d",bd:"#8a6a22",dot:"#ffb02e",ink:"#ffd489"},
                  red:  {bg:"#3a1512",bd:"#8a3630",dot:"#ff5b52",ink:"#ff9d96"}};
  const SDI_MARK={ok:"✓",warn:"!",fail:"✕"};
  const SDI_MARKC={ok:"#36d07a",warn:"#ffb02e",fail:"#ff5b52"};

  function paintSdiStatus(s){
    const n=$("sdiStat"); if(!n||!s)return;
    n.innerHTML="";
    const h=s.health||{level:s.on?"green":"red",checks:[],summary:s.on?"Sending":"Idle"};
    const c=SDI_LAMP[h.level]||SDI_LAMP.red;

    // the lamp itself
    const pill=el("div",{style:"display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:10px;"+
      "background:"+c.bg+";border:1px solid "+c.bd+";margin-bottom:8px"});
    pill.append(el("span",{style:"width:11px;height:11px;border-radius:50%;flex:0 0 auto;background:"+c.dot+
      ";box-shadow:0 0 10px "+c.dot}));
    const txt=el("div",{style:"font-size:12px;font-weight:700;color:"+c.ink});
    txt.append(document.createTextNode(
      h.level==="green"?"KEY + FILL OK":h.level==="amber"?"SENDING — CHECK WARNINGS":"NOT SENDING"));
    const sub=el("div",{style:"font-size:11px;color:var(--muted);margin-top:1px"});
    sub.append(document.createTextNode(String(h.summary||"")));
    const col=el("div",{style:"min-width:0"}); col.append(txt,sub);
    pill.append(col);
    n.append(pill);

    // per-check detail, so a fault names itself instead of just going red
    if(h.checks&&h.checks.length){
      const list=el("div",{style:"font-size:11px;line-height:1.7"});
      h.checks.forEach(k=>{
        const row=el("div",{style:"display:flex;gap:7px;align-items:baseline"});
        row.append(el("span",{style:"color:"+(SDI_MARKC[k.state]||"#888")+";font-weight:700;width:10px;flex:0 0 auto",
          text:SDI_MARK[k.state]||"·"}));
        const lbl=el("span",{style:"color:var(--ink)"}); lbl.append(document.createTextNode(k.label));
        row.append(lbl);
        if(k.detail){ const d=el("span",{style:"color:var(--muted)"}); d.append(document.createTextNode("— "+k.detail)); row.append(d); }
        list.append(row);
      });
      n.append(list);
    }

    if(s.on){
      const stat=el("div",{style:"font-size:11px;color:var(--muted);font-family:var(--mono,monospace);margin-top:6px"});
      const bits=[(s.modeLabel||s.mode||""),"key "+s.level,(s.frames||0)+" frames"];
      if(s.dropped) bits.push(s.dropped+" dropped");
      stat.append(document.createTextNode(bits.join(" · ")));
      n.append(stat);
    }

    // Honest boundary: SDI is one-way, so a green lamp cannot mean the ATEM got it.
    const note=el("p",{class:"hint",style:"margin-top:8px"});
    note.append(document.createTextNode(
      "Green means this card is sending a valid fill + key pair. SDI is one-way, so the app can't "+
      "confirm the cables reach the ATEM or that the keyer is set up — use Send test pattern and "+
      "check the ATEM multiview."));
    n.append(note);
  }

  /* ---- presets + folders ---- */
  function secPresets(){
    const wrap=el("div");
    presets.folders.forEach((f,fi)=>{
      const fol=el("div",{class:"folder"});
      const fh=el("div",{class:"fh"},[
        el("span",{class:"fico",html:svg("folder")}),
        // _open starts undefined and the render below treats undefined as OPEN, so
        // `!undefined` was true and the first click "opened" an already-open folder —
        // it took two clicks to collapse. Normalise against how it actually renders.
        el("span",{class:"fn",text:f.name+"  ("+f.items.length+")",onclick:()=>{f._open=(f._open===false);renderPanels();}}),
        iconBtn("save","Save current preview into this folder",()=>savePresetTo(fi)),
        iconBtn("pencil","Rename folder",()=>{askText("Folder name:",f.name,"Rename").then(n=>{if(n){f.name=n;savePresets(presets);renderPanels();}});}),
        iconBtn("trash","Delete folder",()=>{if(confirm("Delete folder + its presets?")){presets.folders.splice(fi,1);savePresets(presets);renderPanels();}},"danger")
      ]);
      fol.append(fh);
      if(f._open!==false){ f.items.forEach((p,pi)=>{
        fol.append(el("div",{class:"preset"},[
          el("span",{class:"pn",title:"Load into Preview",text:p.name,onclick:()=>loadPreset(p)}),
          iconBtn("refresh","Overwrite with current preview",()=>{p.config=snapshotForPreset();savePresets(presets);}),
          iconBtn("pencil","Rename",()=>{askText("Preset name:",p.name,"Rename").then(n=>{if(n){p.name=n;savePresets(presets);renderPanels();}});}),
          iconBtn("trash","Delete",()=>{f.items.splice(pi,1);savePresets(presets);renderPanels();},"danger")
        ]));
      }); }
      wrap.append(fol);
    });
    const actions=el("div",{class:"row",style:"flex-wrap:wrap;gap:8px"},[
      el("button",{class:"btn sm",html:svg("plus")+" New folder",onclick:()=>{askText("New folder name:","Folder","Create").then(n=>{if(n){presets.folders.push({id:uid(),name:n,items:[]});savePresets(presets);renderPanels();}});}}),
      el("button",{class:"btn sm",html:svg("save")+" Save preview as preset",onclick:()=>savePresetTo(0)}),
      el("button",{class:"btn ghost sm",html:svg("download")+" Export look",title:"Save the current preview design as a portable .json",onclick:exportLook}),
      el("button",{class:"btn ghost sm",html:svg("download")+" Export all presets",title:"Save the whole preset library",onclick:exportPresets}),
      el("button",{class:"btn ghost sm",html:svg("upload")+" Import…",title:"Import a look, a single element, or a preset library",onclick:importGraphics})
    ]);
    const note=el("p",{class:"hint",html:"<b>Export look</b> saves the current design (imported images travel inside the file, so it works on another PC). <b>Import</b> accepts a look, a single element, or a preset library — it validates the file first and won't overwrite anything if it's bad."});
    return section("Presets & folders",[wrap,actions,note],false,"presets");
  }
  function snapshotForPreset(){ const c=clone(preview); delete c.conn; return c; }
  // Guard the empty-library case: the folder trash button splices unconditionally,
  // so after deleting every folder this threw on folders[0] and "Save preview as
  // preset" was permanently dead with no error shown.
  function savePresetTo(fi){
    if(!presets.folders.length){ presets.folders.push({id:uid(),name:"My Presets",items:[]}); fi=0; }
    if(!presets.folders[fi]) fi=0;
    askText("Preset name:","Preset "+(presets.folders[fi].items.length+1),"Save").then(name=>{
      if(!name)return;
      presets.folders[fi].items.push({id:uid(),name,config:snapshotForPreset()});
      savePresets(presets); renderPanels();
    });
  }
  function loadPreset(p){ const keepConn=clone(preview.conn); preview=deepMerge(defaultConfig(),Object.assign({},p.config,{conn:keepConn}));
    // ensure element ids exist
    (preview.elements||[]).forEach(e=>{ if(!e.id)e.id=uid(); });
    selectedId=preview.elements[0]?preview.elements[0].id:null; applyPreview(); renderPanels(); }
  function flashName(n){ /* no-op visual */ }
  /* ================= GRAPHICS IMPORT / EXPORT =================================
     Portable .json files for moving designs between machines (home <-> stream PC),
     backing them up, or sharing them.

     Three kinds, all in one envelope so a single Import button handles any file:
       look     — one design (every element on the stage)
       element  — a single lower third
       library  — the whole preset library, folders and all

     Imported media rides along: images are already inlined as base64 data URIs in
     the config, so a look file is self-contained.

     NOTHING IS TRUSTED. The old importer did `if(p.folders){presets=p;save()}` —
     any JSON with a truthy `folders` key overwrote the library and was PERSISTED
     BEFORE being rendered, so one malformed file bricked the console on every
     later boot. Now every file is validated and rebuilt from known-good defaults
     before anything is written. */
  /* ---- export ---- */
  function exportLook(){
    const cfg=snapshotForPreset();
    gfxSave(gfxWrap("look",{name:"Look",config:cfg}),"lt-look-"+safeName(new Date().toISOString().slice(0,10))+".json");
  }
  function exportElement(d){
    if(!d)return;
    gfxSave(gfxWrap("element",{element:clone(d)}),"lt-"+safeName(d.name||d.type)+".json");
  }
  function exportPresets(){
    gfxSave(gfxWrap("library",{folders:presets.folders}),"lower-thirds-presets.json");
  }

  /* ---- import ---- */
  function importGraphics(){
    const inp=el("input",{type:"file",accept:".json,application/json"});
    inp.onchange=()=>{
      const f=inp.files&&inp.files[0]; if(!f)return;
      if(f.size>25*1024*1024){ alert("That file is "+(f.size/1048576).toFixed(1)+" MB — too large to import safely."); return; }
      const rd=new FileReader();
      rd.onerror=()=>alert("Couldn't read that file.");
      rd.onload=()=>{
        // parseGfx validates, but a pathological file can still throw inside it (deep
        // nesting, a getter, a hostile shape). Catch here so a bad import reports a
        // failure instead of dying silently with the console half-rendered.
        let r; try{ r=parseGfx(String(rd.result||"")); }
        catch(e){ alert("Import failed.\n\nThat file couldn't be read as a graphic.\n\n"+String((e&&e.message)||e)); return; }
        if(!r||!r.ok){ alert("Import failed.\n\n"+((r&&r.error)||"Unrecognised file.")); return; }   // nothing written on failure
        if(r.kind==="element"){
          preview.elements.push(r.payload); selectedId=r.payload.id;
          savePreview(); applyPreview(); renderPanels();
          alert("Added 1 element to the preview.\n\nPress TAKE to send it live.");
        } else if(r.kind==="look"){
          if(!confirm("Replace the current preview with the imported look?\n\nYour presets are untouched, and this only affects Preview until you press TAKE."))return;
          const keepConn=clone(preview.conn||{});
          preview=r.payload.config; preview.conn=keepConn;
          selectedId=preview.elements[0]?preview.elements[0].id:null;
          savePreview(); applyPreview(); renderPanels();
        } else if(r.kind==="library"){
          // Cancel/Escape must NOT be the destructive branch. It was wired as
          // "Cancel = REPLACE everything", so dismissing the dialog wiped the entire
          // preset library. Ask for the destructive option explicitly instead.
          const replace=confirm("Import "+r.payload.length+" folder(s).\n\n"+
            "OK = REPLACE your whole preset library.\nCancel = ADD these folders to it.");
          if(replace && !confirm("Really replace ALL "+presets.folders.length+" existing folder(s)?\n\nThis cannot be undone."))return;
          presets.folders=replace?r.payload:presets.folders.concat(r.payload);
          savePresets(presets); renderPanels();
        }
      };
      rd.readAsText(f);
    };
    inp.click();
  }

  /* ---- OPERATOR MODE (Showcaller / Simple) ---- */
  const LS_VIEW="pplt.view.v1";
  let viewMode="builder", currentLookId=null;
  function blankLook(){ const c=defaultConfig(); c.elements=[]; return c; }
  function setView(m){
    if(m!=="builder"&&m!=="showcaller"&&m!=="simple")m="builder";
    viewMode=m; lsSet(LS_VIEW,m);
    const root=$("console-root");
    root.classList.toggle("op",m!=="builder");
    root.classList.toggle("skin-showcaller",m==="showcaller");
    root.classList.toggle("skin-simple",m==="simple");
    const vs=$("viewSwitch"); if(vs)[...vs.querySelectorAll("button")].forEach(b=>b.classList.toggle("on",b.dataset.view===m));
    if(m!=="builder")renderOpLooks();
    requestAnimationFrame(()=>{ try{ pvStage.setScale(fitScaler(pvScaler,pvMon)); fitScaler(pgScaler,pgMon); }catch(e){} });
  }
  function renderOpLooks(){
    const grid=$("opLookGrid"); if(!grid)return; grid.innerHTML="";
    const blank=el("button",{class:"ol-tile blank"+(currentLookId==="__blank__"?" sel":""),onclick:()=>{
        const keepConn=clone(preview.conn); preview=Object.assign(blankLook(),{conn:keepConn});
        selectedId=null; currentLookId="__blank__"; applyPreview(); renderPanels(); renderOpLooks(); }},
      [el("div",{class:"t-name",text:"Blank / Clear"}),el("div",{class:"t-sub",text:"empty the screen"})]);
    grid.append(blank);
    let n=0;
    (presets.folders||[]).forEach(f=>{ (f.items||[]).forEach(it=>{ n++;
      const tile=el("button",{class:"ol-tile"+(currentLookId===it.id?" sel":""),onclick:()=>{
          currentLookId=it.id; loadPreset(it); renderOpLooks(); }},
        [el("div",{class:"t-name",text:it.name||("Look "+n)}),el("div",{class:"t-sub",text:f.name||"Presets"})]);
      grid.append(tile); }); });
    if(n===0) grid.append(el("div",{class:"ol-empty",text:"No saved looks yet. In Builder, style a look and Save it as a preset \u2014 it'll appear here as a tile."}));
  }
  { const vs=$("viewSwitch"); if(vs)[...vs.querySelectorAll("button")].forEach(b=>{ b.onclick=()=>setView(b.dataset.view); }); }
  setInterval(()=>{ const c=$("opClock"); if(c){ const d=new Date(),p=(x)=>String(x).padStart(2,"0");
    c.textContent=p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds()); } },1000);

  /* ---- go ---- */
  renderPanels();
  applyBg(pgMon,program.out.bg); pgStage.setConfig(program); pgStage.setHistory(liveLog);
  applyPreview(); pvStage.setHistory(liveLog);
  const ro1=new ResizeObserver(()=>pvStage.setScale(fitScaler(pvScaler,pvMon))); ro1.observe(pvMon); pvStage.setScale(fitScaler(pvScaler,pvMon));
  const ro2=new ResizeObserver(()=>fitScaler(pgScaler,pgMon)); ro2.observe(pgMon); fitScaler(pgScaler,pgMon);
  startConsolePP();
  // lsSet writes JSON, so the stored value is `"simple"` WITH quotes. Reading it raw
  // never matched, so the operator's view choice silently reset to Builder on every
  // launch. Parse it, and still accept a legacy unquoted value.
  setView((function(){ try{ const r=localStorage.getItem(LS_VIEW); if(!r)return "builder";
    try{ return JSON.parse(r); }catch(e){ return r; } }catch(e){ return "builder"; } })());
  updateTakeState();
  setTimeout(()=>{ if(!liveMode){ pvStage.setLive(SAMPLE1); setTally(pvMonTally,true); } },300);
}
</script>
</body>
</html>
