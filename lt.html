/* ==================================================================== THEME
   Brand tokens. Any style colour or font may hold a token reference like
   "@accent" instead of a literal, so changing the token restyles every element
   that points at it — one place to rebrand the whole package.

   Literals still work exactly as before, so nothing existing has to migrate:
   resolveTok() passes through anything that isn't a "@name" reference. */
const THEME_COLOR_KEYS=["accent","ink","muted","panel"];
const THEME_FONT_KEYS=["display","body"];
function defaultTheme(){
  return {
    accent:"#c9a24b",     // gold — bars, references, labels
    ink:"#ffffff",        // primary text
    muted:"#c9d4e6",      // secondary text
    panel:"#0b1220",      // chip / panel fills
    // These MUST be byte-identical to entries in THEME_FONTS, or the Brand-theme
    // dropdowns cannot match them and display the wrong font on a fresh config.
    display:"'Oswald','Arial Narrow',sans-serif",
    body:"Georgia,'Times New Roman',serif"
  };
}
function resolveTok(v,theme){
  if(typeof v!=="string"||v.charAt(0)!=="@")return v;
  const k=v.slice(1);
  if(theme&&theme[k]!=null)return theme[k];
  const d=defaultTheme();
  return d[k]!=null?d[k]:v;      // unknown token -> fall back to the shipped default
}
// The active theme for the render currently in flight. Each stage stamps this at
// the top of its renderAll(), which is synchronous, so the two console monitors
// (preview vs program) can hold different themes without threading a theme
// argument through every style call.
let CUR_THEME=defaultTheme();
function setCurTheme(t){ CUR_THEME=Object.assign(defaultTheme(),t||{}); }
function tok(v){ return resolveTok(v,CUR_THEME); }

/* ============================================================== LIVE DATA
   Any operator-typed text may contain {{name}} placeholders, filled from bound
   sources (a Google Sheet published as CSV, a JSON endpoint, a plain text file).
   That composes with everything: a QR link, a clock label, a bullet list, a
   manual verse — all just text.

   An UNKNOWN placeholder is left verbatim rather than blanked, so a source that
   fails mid-service shows "{{offering}}" on air instead of an empty box. That is
   ugly on purpose: silence would look intentional and could go unnoticed. */
function applyVars(s,vars){
  if(typeof s!=="string"||s.indexOf("{{")<0)return s;
  return s.replace(/\{\{\s*([\w.\- ]+?)\s*\}\}/g,(m,k)=>{
    // hasOwnProperty, not a plain lookup: {{constructor}} or {{toString}} would
    // otherwise resolve against Object.prototype and paint "function Object() {...}"
    // on air instead of staying verbatim.
    const v=(vars&&Object.prototype.hasOwnProperty.call(vars,k))?vars[k]:undefined;
    return (v==null||v==="")?m:String(v);
  });
}
let CUR_VARS={};
function setCurVars(v){ CUR_VARS=(v&&typeof v==="object")?v:{}; }
// shallow-deep copy with every string run through applyVars
function subVars(o,vars){
  vars=vars||CUR_VARS;
  if(o==null)return o;
  if(typeof o==="string")return applyVars(o,vars);
  if(Array.isArray(o))return o.map(x=>subVars(x,vars));
  if(typeof o==="object"){ const out={}; for(const k in o)out[k]=subVars(o[k],vars); return out; }
  return o;
}
// Pull named values out of a fetched body. Deliberately forgiving about shape —
// a bound source is usually somebody's spreadsheet, not a designed API.
function parseDataSource(kind,body,pick,layout){
  const vars={};
  const txt=String(body==null?"":body);
  try{
    if(kind==="json"){
      const j=JSON.parse(txt);
      const root=(pick?pick.split(".").reduce((a,k)=>(a==null?a:a[k]),j):j);
      if(root&&typeof root==="object"&&!Array.isArray(root)){ for(const k in root){ const v=root[k]; if(v==null||typeof v==="object")continue; vars[k]=String(v); } }
      else if(root!=null&&typeof root!=="object")vars.value=String(root);
    } else if(kind==="csv"){
      // Two shapes, and they are genuinely AMBIGUOUS for a two-column sheet:
      //   offering,$12450      -> name,value rows
      //   offering,attendance  -> a header row, values on the next row
      //   $999,42
      // No heuristic can tell those apart, so `layout` is an explicit operator choice.
      // The default only guesses where it is safe: exactly two columns is
      // overwhelmingly a name/value sheet, wider is a table.
      // Split on newlines that are NOT inside quotes — a quoted cell may legitimately
      // contain a line break (Google Sheets exports them that way), and splitting
      // blindly truncated the value and turned the remainder into a junk placeholder.
      // Also strips a UTF-8 BOM, which would otherwise become part of the first name.
      const clean=txt.replace(/^﻿/,"").replace(/\r\n/g,"\n").replace(/\r/g,"\n");
      const lines=[]; let cur="",inQ=false;
      for(let i=0;i<clean.length;i++){
        const ch=clean[i];
        if(ch==='"'){ if(inQ&&clean[i+1]==='"'){cur+='""';i++;} else {inQ=!inQ;cur+=ch;} }
        else if(ch==="\n"&&!inQ){ lines.push(cur); cur=""; }
        else cur+=ch;
      }
      lines.push(cur);
      const rows=lines.map(l=>l.trim()).filter(Boolean).map(l=>splitCsv(l));
      if(!rows.length)return vars;
      const mode=layout||((rows[0].length===2)?"pairs":"table");
      if(mode==="pairs"){
        rows.forEach(r=>{ if(r[0])vars[r[0]]=(r[1]==null?"":r[1]); });
      } else if(rows.length>=2){
        rows[0].forEach((h,i)=>{ if(h)vars[h]=(rows[1][i]==null?"":rows[1][i]); });
      } else {
        rows[0].forEach((c,i)=>{ vars["col"+(i+1)]=c; });
      }
    } else {
      vars.value=txt.trim().slice(0,500);
    }
  }catch(e){ /* a malformed source contributes nothing rather than throwing */ }
  return vars;
}
function splitCsv(line){
  const out=[]; let cur="",q=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(q){ if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if(ch==='"')q=true;
    else if(ch===","){ out.push(cur.trim()); cur=""; }
    else cur+=ch;
  }
  out.push(cur.trim());
  return out;
}

/* ================================================================= QR CODE
   Self-contained QR encoder — byte mode, error-correction level M, versions
   1-10 (up to 216 bytes, far more than a giving URL needs). No dependency, so
   lt.html stays a single file that runs anywhere.

   Level M ("~15% recoverable") is the right default for a screen: high enough
   that a camera at the back of a room still reads it, low enough that the code
   stays coarse and scannable rather than dense.

   Verified by round-tripping through an INDEPENDENT decoder in
   test/qr_test.js — a shared misreading of the spec would have to break both
   the encoder and the decoder in the same direction to slip through. The
   Reed-Solomon stage is additionally pinned with known-answer tests.        */
const QR_ECC="M";
// [ecc codewords per block, blocks in group 1, data cw per block G1, blocks G2, data cw G2]
const QR_SPECS={
  1:[10,1,16,0,0],  2:[16,1,28,0,0],  3:[26,1,44,0,0],  4:[18,2,32,0,0],  5:[24,2,43,0,0],
  6:[16,4,27,0,0],  7:[18,4,31,0,0],  8:[22,2,38,2,39], 9:[22,3,36,2,37], 10:[26,4,43,1,44]
};
const QR_ALIGN={1:[],2:[6,18],3:[6,22],4:[6,26],5:[6,30],6:[6,34],7:[6,22,38],8:[6,24,42],9:[6,26,46],10:[6,28,50]};
const QR_MAXV=10;

/* ---- GF(256), primitive polynomial 0x11D ---- */
const QR_EXP=new Uint8Array(512), QR_LOG=new Uint8Array(256);
(function(){ let x=1;
  for(let i=0;i<255;i++){ QR_EXP[i]=x; QR_LOG[x]=i; x<<=1; if(x&0x100)x^=0x11D; }
  for(let i=255;i<512;i++)QR_EXP[i]=QR_EXP[i-255];
})();
function qrMul(a,b){ return (a===0||b===0)?0:QR_EXP[QR_LOG[a]+QR_LOG[b]]; }
// generator polynomial of degree n
function qrGenPoly(n){
  let p=[1];
  for(let i=0;i<n;i++){
    const q=new Array(p.length+1).fill(0);
    for(let j=0;j<p.length;j++){ q[j]^=qrMul(p[j],1); q[j+1]^=qrMul(p[j],QR_EXP[i]); }
    p=q;
  }
  return p;
}
function qrEcc(data,n){
  const gen=qrGenPoly(n), res=new Array(data.length+n).fill(0);
  for(let i=0;i<data.length;i++)res[i]=data[i];
  for(let i=0;i<data.length;i++){
    const f=res[i]; if(f===0)continue;
    for(let j=0;j<gen.length;j++)res[i+j]^=qrMul(gen[j],f);
  }
  return res.slice(data.length);
}

/* ---- BCH check bits (format and version information) ---- */
function qrFormatBits(maskIdx){
  // ECC level M = 0b00; 5 data bits = level(2) + mask(3)
  const data=(0b00<<3)|maskIdx;
  let rem=data;
  for(let i=0;i<10;i++){ rem=(rem<<1); if(rem&(1<<10))rem^=0b10100110111; }
  return (((data<<10)|rem)^0b101010000010010);
}
function qrVersionBits(v){
  let rem=v;
  for(let i=0;i<12;i++){ rem=(rem<<1); if(rem&(1<<12))rem^=0b1111100100101; }
  return (v<<12)|rem;
}

/* ---- encode a string to a boolean module matrix ---- */
function qrEncode(text){
  const bytes=[];
  // UTF-8; readers handle it in byte mode
  // encodeURIComponent throws URIError on a lone surrogate (a half-pasted emoji), which
  // aborted the whole render pass. Strip unpaired surrogates first.
  const clean=String(text==null?"":text).replace(/[\uD800-\uDBFF](?![\uDC00-\uDFFF])/g,"").replace(/(^|[^\uD800-\uDBFF])[\uDC00-\uDFFF]/g,"$1");
  let s; try{ s=unescape(encodeURIComponent(clean)); }catch(e){ return null; }
  for(let i=0;i<s.length;i++)bytes.push(s.charCodeAt(i)&0xFF);

  // smallest version that fits
  let ver=0;
  for(let v=1;v<=QR_MAXV;v++){
    const sp=QR_SPECS[v], cap=sp[1]*sp[2]+sp[3]*sp[4];
    const cciBits=(v<=9)?8:16;
    if(bytes.length + Math.ceil((4+cciBits)/8) <= cap){ ver=v; break; }
  }
  if(!ver) return null;                       // too long for version 10 at level M

  const sp=QR_SPECS[ver], totalData=sp[1]*sp[2]+sp[3]*sp[4];
  const cciBits=(ver<=9)?8:16;

  /* bit stream */
  const bits=[];
  const put=(val,n)=>{ for(let i=n-1;i>=0;i--)bits.push((val>>i)&1); };
  put(0b0100,4); put(bytes.length,cciBits);
  bytes.forEach(b=>put(b,8));
  const capBits=totalData*8;
  for(let i=0;i<4&&bits.length<capBits;i++)bits.push(0);      // terminator
  while(bits.length%8)bits.push(0);
  const dataCw=[];
  for(let i=0;i<bits.length;i+=8){ let b=0; for(let j=0;j<8;j++)b=(b<<1)|bits[i+j]; dataCw.push(b); }
  const PADS=[0xEC,0x11];
  for(let i=0;dataCw.length<totalData;i++)dataCw.push(PADS[i%2]);

  /* split into blocks, ECC each, then interleave */
  const blocks=[],eccs=[];
  let p=0;
  for(let i=0;i<sp[1];i++){ blocks.push(dataCw.slice(p,p+sp[2])); p+=sp[2]; }
  for(let i=0;i<sp[3];i++){ blocks.push(dataCw.slice(p,p+sp[4])); p+=sp[4]; }
  blocks.forEach(b=>eccs.push(qrEcc(b,sp[0])));
  const finalCw=[];
  const maxData=Math.max(sp[2],sp[4]||0);
  for(let i=0;i<maxData;i++)blocks.forEach(b=>{ if(i<b.length)finalCw.push(b[i]); });
  for(let i=0;i<sp[0];i++)eccs.forEach(e=>finalCw.push(e[i]));

  /* matrix */
  const size=17+4*ver;
  const m=[],res=[];                                   // res = reserved (function patterns)
  for(let i=0;i<size;i++){ m.push(new Array(size).fill(false)); res.push(new Array(size).fill(false)); }
  const setF=(r,c,v)=>{ if(r<0||c<0||r>=size||c>=size)return; m[r][c]=v; res[r][c]=true; };

  // finder + separators
  const finder=(R,C)=>{
    for(let r=-1;r<=7;r++)for(let c=-1;c<=7;c++){
      const rr=R+r, cc=C+c; if(rr<0||cc<0||rr>=size||cc>=size)continue;
      const on=(r>=0&&r<=6&&(c===0||c===6))||(c>=0&&c<=6&&(r===0||r===6))||(r>=2&&r<=4&&c>=2&&c<=4);
      setF(rr,cc,on);
    }
  };
  finder(0,0); finder(0,size-7); finder(size-7,0);
  // timing
  for(let i=8;i<size-8;i++){ setF(6,i,i%2===0); setF(i,6,i%2===0); }
  // alignment
  const al=QR_ALIGN[ver];
  al.forEach(r=>al.forEach(c=>{
    if((r<=8&&c<=8)||(r<=8&&c>=size-9)||(r>=size-9&&c<=8))return;   // skip finder corners
    for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++)
      setF(r+dr,c+dc, Math.max(Math.abs(dr),Math.abs(dc))!==1);
  }));
  // dark module + reserve format areas
  setF(size-8,8,true);
  for(let i=0;i<9;i++){ if(!res[8][i])setF(8,i,false); if(!res[i][8])setF(i,8,false); }
  for(let i=0;i<8;i++){ if(!res[8][size-1-i])setF(8,size-1-i,false); if(!res[size-1-i][8])setF(size-1-i,8,false); }
  // version info (v7+)
  if(ver>=7){
    const vb=qrVersionBits(ver);
    for(let i=0;i<18;i++){ const b=((vb>>i)&1)===1; const r=Math.floor(i/3), c=i%3;
      setF(size-11+c,r,b); setF(r,size-11+c,b); }
  }

  /* data placement — zigzag upward/downward in 2-column strips, skipping col 6 */
  let bi=0; const bitAt=(i)=> (i<finalCw.length*8) ? ((finalCw[i>>3]>>(7-(i&7)))&1)===1 : false;
  let up=true;
  for(let c=size-1;c>0;c-=2){
    if(c===6)c--;                                     // the vertical timing column
    for(let n=0;n<size;n++){
      const r=up?(size-1-n):n;
      for(let k=0;k<2;k++){
        const cc=c-k;
        if(res[r][cc])continue;
        m[r][cc]=bitAt(bi++);
      }
    }
    up=!up;
  }

  /* pick the mask with the lowest penalty */
  const maskFn=[
    (r,c)=>((r+c)%2===0),        (r,c)=>(r%2===0),           (r,c)=>(c%3===0),
    (r,c)=>((r+c)%3===0),        (r,c)=>((Math.floor(r/2)+Math.floor(c/3))%2===0),
    (r,c)=>(((r*c)%2)+((r*c)%3)===0), (r,c)=>((((r*c)%2)+((r*c)%3))%2===0),
    (r,c)=>((((r+c)%2)+((r*c)%3))%2===0)
  ];
  let best=null,bestScore=Infinity;
  for(let k=0;k<8;k++){
    const t=m.map(row=>row.slice());
    for(let r=0;r<size;r++)for(let c=0;c<size;c++)
      if(!res[r][c]&&maskFn[k](r,c))t[r][c]=!t[r][c];
    // format info for this mask
    const fb=qrFormatBits(k);
    for(let i=0;i<15;i++){
      // Placement position i carries format bit INDEX i, where index 0 is the MSB
      // (ISO/IEC 18004). Writing the LSB at (8,0) instead reverses the whole word:
      // a scanner reads it MSB-first, the BCH check fails, and the symbol is rejected
      // — every code came out unscannable. A round trip cannot catch this on its own,
      // because a decoder written the same way reverses it right back.
      const b=((fb>>(14-i))&1)===1;
      // copy 1 (around the top-left finder)
      if(i<6)t[8][i]=b; else if(i===6)t[8][7]=b; else if(i===7)t[8][8]=b;
      else if(i===8)t[7][8]=b; else t[14-i][8]=b;
      // copy 2: SEVEN modules up column 8 (rows size-1 .. size-7), then EIGHT along
      // row 8 (cols size-8 .. size-1). Taking eight down the column instead of seven
      // overwrites the dark module at (size-8, 8), which is a fixed always-on module.
      if(i<7)t[size-1-i][8]=b; else t[8][size-15+i]=b;
    }
    const sc=qrPenalty(t,size);
    if(sc<bestScore){ bestScore=sc; best=t; }
  }
  return {size,modules:best,version:ver};
}

/* ---- mask penalty (ISO/IEC 18004 rules 1-4) ---- */
function qrPenalty(m,size){
  let p=0;
  const run=(get)=>{
    for(let a=0;a<size;a++){
      let last=null,len=0;
      for(let b=0;b<size;b++){
        const v=get(a,b);
        if(v===last)len++; else {last=v;len=1;}
        if(len===5)p+=3; else if(len>5)p+=1;
      }
    }
  };
  run((r,c)=>m[r][c]); run((c,r)=>m[r][c]);                       // rule 1
  for(let r=0;r<size-1;r++)for(let c=0;c<size-1;c++)             // rule 2
    if(m[r][c]===m[r][c+1]&&m[r][c]===m[r+1][c]&&m[r][c]===m[r+1][c+1])p+=3;
  const pat=[true,false,true,true,true,false,true,false,false,false,false];
  const hit=(get,a,b)=>{ for(let i=0;i<11;i++){ if(b+i>=size)return false; if(get(a,b+i)!==pat[i])return false; } return true; };
  const hitR=(get,a,b)=>{ for(let i=0;i<11;i++){ if(b+i>=size)return false; if(get(a,b+i)!==pat[10-i])return false; } return true; };
  for(let a=0;a<size;a++)for(let b=0;b<size;b++){                 // rule 3
    if(hit((x,y)=>m[x][y],a,b)||hitR((x,y)=>m[x][y],a,b))p+=40;
    if(hit((x,y)=>m[y][x],a,b)||hitR((x,y)=>m[y][x],a,b))p+=40;
  }
  let dark=0; for(let r=0;r<size;r++)for(let c=0;c<size;c++)if(m[r][c])dark++;
  const pct=dark*100/(size*size);
  p+=Math.floor(Math.abs(pct-50)/5)*10;                           // rule 4
  return p;
}

/* ---- render to a crisp SVG path (scales to any size with no blur) ---- */
// Only a literal colour may reach the generated markup. The rest of the SVG is
// machine-generated path data, so this is the single place operator/config text
// could otherwise be interpolated into markup.
function qrColor(v,fb){
  const s=String(v==null?"":v).trim();
  return /^#[0-9a-f]{3,8}$/i.test(s)||/^rgba?\([\d.,\s%]+\)$/i.test(s) ? s : fb;
}
function qrSvg(text,opts){
  opts=opts||{};
  const q=qrEncode(text);
  if(!q)return null;
  const quiet=(opts.quiet==null?4:opts.quiet);                    // spec minimum is 4 modules
  const total=q.size+quiet*2;
  let d="";
  for(let r=0;r<q.size;r++)for(let c=0;c<q.size;c++)
    if(q.modules[r][c])d+="M"+(c+quiet)+" "+(r+quiet)+"h1v1h-1z";
  const fg=qrColor(opts.fg,"#000000"), bg=qrColor(opts.bg,"#ffffff");
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+total+' '+total+'" '+
         'shape-rendering="crispEdges" width="100%" height="100%">'+
         (opts.transparent?'':'<rect width="'+total+'" height="'+total+'" fill="'+bg+'"/>')+
         '<path d="'+d+'" fill="'+fg+'"/></svg>';
}

/* ================================================================== RULES
   "While the live slide matches ___, show/hide ___."

   A rule takes FULL control of its target while it is enabled: when the pattern
   matches the target follows the action, and when it doesn't the target does the
   opposite. Half-control ("show on match, otherwise behave normally") sounds
   friendlier but is useless in practice — the element would just sit on air the
   whole time, because its own content still exists.

   On a cleared slide every rule releases its target back to normal visibility,
   so a rule can never pin something on air after Clear All.

   Returns { elementId: true|false } — an override map consulted by activeBase(). */
function evalRules(rules,ctx){
  const out={};
  ctx=ctx||{};
  if(ctx.cleared) return out;                 // cleared -> no rule holds anything on air
  const text=String(ctx.text||""), ref=String(ctx.ref||"");
  (Array.isArray(rules)?rules:[]).forEach(r=>{
    if(!r||r.enabled===false||!r.target)return;
    const hay=(r.on==="ref")?ref:text;
    let hit=false;
    if(r.match==="any") hit=true;
    else if(r.match==="regex"){ try{ hit=new RegExp(String(r.pattern||""),"i").test(hay); }catch(e){ hit=false; } }
    else { const p=String(r.pattern||""); hit=p!=="" && hay.toLowerCase().indexOf(p.toLowerCase())>=0; }
    const wantShow=(r.act!=="hide");
    out[r.target]=hit?wantShow:!wantShow;
  });
  return out;
}

function defaultConfig(){
  return {
    conn:{host:"",port:1025,pollMs:200,clearRule:"all",clearLayer:"media"},
    out:{bg:"transparent",safe:false},
    theme:defaultTheme(),
    rules:[],
    // Present from the start so the panel's lazy init can't make Preview differ from
    // Program and light TAKE as "pending" the moment the section is opened.
    data:{sources:[]},
    elements:[ createElement("scripture"), createElement("history") ]
  };
}
/* Clear-detection default — CORRECTED against real hardware (ProPresenter 21.2, 2026-08-03).
   v1.0.4 switched the default to "pres" on the belief that /v1/presentation/active stays
   populated through Clear Slide and only goes null on Clear All. Measured on a real rig,
   that is NOT true — it goes null for BOTH, so "pres" can never tell them apart and every
   Clear Slide was treated as a full clear (the ref-list header disappeared on F2):

     state         slide   media   presentation
     slide live    true    true    populated
     Clear Slide   false   TRUE    null
     Clear All     false   FALSE   null

   `media` is the real discriminator, which is exactly what the "all layers off" rule uses.

   WHY THE GUARD IS _ruleMig2 ALONE: the first attempt here also required !_ruleMig, on the
   assumption that _ruleMig marks a deliberate operator pick. It does not. The v1.0.4
   migration set _ruleMig=true on its OWN automatic flip:
       if(clearRule==="all" && !_ruleMig){ clearRule="pres"; _ruleMig=true; }
   so on any install that predates v1.0.4, _ruleMig=true means "auto-flipped", and it is
   byte-identical to an operator pick. Requiring !_ruleMig therefore skipped exactly the
   population this migration exists to rescue — they would have kept the broken rule forever,
   because the migration is idempotent and never self-corrects on a later boot.

   Since "pres" is measurably non-functional on PP 21.2 (it cannot distinguish the two
   clears at all), everyone comes off it once. _ruleMig2 makes that a single event: an
   operator who re-picks "pres" afterwards keeps it permanently, because the segmented
   control stamps _ruleMig2 too (see the clearRule row in the connection panel). */
function migrateClearRule(cfg){
  if(cfg&&cfg.conn&&cfg.conn.clearRule==="pres"&&!cfg.conn._ruleMig2){
    cfg.conn.clearRule="all"; cfg.conn._ruleMig2=true;
  }
  return cfg;
}

/* The v1.3.3 geometry fix (scripture could only ever show ONE line of its own verse, and the
   stock scripture + reference list overlapped by 120px) changed createElement's defaults —
   which only affects elements created AFTERWARDS. Every machine that has already run the app
   has a stored config, so without this the headline fix of that release reached nobody who
   was already using it, including the rig the bug was measured on.

   Deliberately conservative: an element is rewritten ONLY if its layout is byte-identical to
   the retired factory default, which means the operator never touched it. Any custom size or
   position — even one number off — is left completely alone. Runs once (_layoutMig). */
const RETIRED_LAYOUTS={
  scripture:{was:{x:120,y:820,w:1100,h:180}, now:{x:120,y:720,w:1100,h:280}},
  history:  {was:{x:120,y:560,w:620, h:380}, now:{x:120,y:340,w:620, h:360}},
  eventList:{was:{x:120,y:560,w:620, h:380}, now:{x:120,y:340,w:620, h:360}}
};
function migrateLayout(cfg){
  if(!cfg||cfg._layoutMig) return cfg;
  const els=Array.isArray(cfg.elements)?cfg.elements:[];
  els.forEach(el=>{
    const m=el&&RETIRED_LAYOUTS[el.type], L=el&&el.layout;
    if(!m||!L) return;
    if(L.x===m.was.x&&L.y===m.was.y&&L.w===m.was.w&&L.h===m.was.h){
      el.layout=Object.assign({},L,m.now);
    }
  });
  cfg._layoutMig=true;
  return cfg;
}

const TYPE_LABELS={scripture:"Scripture",reference:"Reference",sermonTitle:"Sermon title",
  bulletList:"Bullet list",history:"Scripture ref list",eventList:"Event list",name:"Name/title",text:"Text",media:"Image / Media",
  clock:"Timer / clock",qr:"QR code"};
const ADD_TYPES=["scripture","reference","name","sermonTitle","bulletList","history","eventList","text","media","clock","qr"];
// Types that can scroll as a ticker / credits-roll. Shared by setText (which decides
// whether to hand off to renderMarquee) and applyBox (which needs the same answer one
// step EARLIER, from the config alone).
const MARQ_TYPES=["text","reference","scripture","name","sermonTitle","bulletList","history","eventList"];

/* ------------------------------------------------------------- clock helpers */
function pad2(n){ n=Math.floor(Math.abs(n)); return (n<10?"0":"")+n; }
// secs -> "h:mm:ss" / "m:ss" depending on size, or forced by fmt
function fmtDur(secs,fmt){
  const neg=secs<0; secs=Math.abs(Math.floor(secs||0));
  const h=Math.floor(secs/3600), m=Math.floor((secs%3600)/60), s=secs%60;
  let out;
  if(fmt==="mm:ss") out=Math.floor(secs/60)+":"+pad2(s);
  else if(fmt==="h:mm:ss"||h>0) out=h+":"+pad2(m)+":"+pad2(s);
  else out=m+":"+pad2(s);
  return (neg?"-":"")+out;
}
function fmtClock(d,fmt){
  let h=d.getHours(); const m=d.getMinutes(), s=d.getSeconds();
  if(fmt==="H:mm"||fmt==="H:mm:ss") return h+":"+pad2(m)+(fmt==="H:mm:ss"?":"+pad2(s):"");
  const ap=h>=12?"PM":"AM"; h=h%12; if(h===0)h=12;
  return h+":"+pad2(m)+(fmt==="h:mm:ss"?":"+pad2(s):"")+" "+ap;
}
// "11:00" / "11:00:30" -> seconds remaining until that time TODAY (next day if past)
// Seconds until the target time TODAY. Deliberately does NOT roll forward to
// tomorrow once the time has passed: rolling meant a countdown that had just
// reached zero flipped to ~23:59 and a "hide at zero" element came BACK on air
// counting down a whole day. Passed is passed — the caller shows the zero text or
// hides. (Rolling also can't be done correctly across a DST change.)
function secsUntilClock(target,now){
  const mm=String(target||"").match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/); if(!mm)return null;
  const h=Number(mm[1]), m=Number(mm[2]), s=Number(mm[3]||0);
  if(h>23||m>59||s>59)return null;
  const t=new Date(now.getTime());
  t.setHours(h,m,s,0);
  return Math.round((t.getTime()-now.getTime())/1000);
}
// ProPresenter timer payloads vary by build; pull a seconds value out defensively.
function ppTimerSeconds(t){
  if(t==null)return null;
  if(typeof t==="number")return t;
  if(typeof t==="string"){
    const m=t.match(/^(-)?(?:(\d+):)?(\d{1,2}):(\d{2})$/);
    if(m){ const v=(Number(m[2]||0)*3600)+(Number(m[3])*60)+Number(m[4]); return m[1]?-v:v; }
    const n=Number(t); return isNaN(n)?null:n;
  }
  if(typeof t==="object"){
    for(const k of ["time","seconds","value","remaining","duration"]){
      if(t[k]!=null){ const v=ppTimerSeconds(t[k]); if(v!=null)return v; }
    }
    if(t.countdown!=null)return ppTimerSeconds(t.countdown);
    if(t.elapsed!=null)return ppTimerSeconds(t.elapsed);
    if(t.data!=null)return ppTimerSeconds(t.data);
  }
  return null;
}
function ppTimerName(t){
  if(!t||typeof t!=="object")return "";
  if(typeof t.name==="string")return t.name;
  if(t.id&&typeof t.id==="object"&&typeof t.id.name==="string")return t.id.name;
  if(typeof t.id==="string")return t.id;
  return "";
}

/* ============================================== GRAPHICS IMPORT / EXPORT (pure)
   Portable .json for moving designs between machines (home <-> stream PC), backing
   them up, or sharing them. Three kinds share one envelope so a single Import
   button handles any file: `look` (a whole design), `element` (one lower third),
   `library` (the preset library). Imported images are already inlined as base64
   data URIs in the config, so a look file is self-contained.

   NOTHING FROM A FILE IS TRUSTED. The old importer did
   `if(p.folders){presets=p; save();}` — any JSON with a truthy `folders` key
   overwrote the library and was PERSISTED BEFORE it was rendered, so one malformed
   file bricked the console on every later boot with no way back from the UI. Every
   file is now validated and rebuilt from known-good defaults before anything is
   written, and a bad file writes nothing at all.

   Kept at top level (not in the console scope) so it is unit-testable. */
const GFX_FORMAT="lower-thirds-engine";
const GFX_VERSION=1;

function gfxWrap(kind,body){
  return Object.assign({format:GFX_FORMAT,version:GFX_VERSION,kind,exported:new Date().toISOString()},body);
}
function safeName(s){ return String(s||"graphic").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"-").slice(0,40)||"graphic"; }

// Rebuild from a fresh, known-good default of the DECLARED type, so unknown or
// hostile fields in a file can never reach the renderer.
function sanitizeElement(raw){
  if(!raw||typeof raw!=="object")return null;
  if(ADD_TYPES.indexOf(raw.type)<0)return null;         // unknown type -> drop it
  const base=createElement(raw.type);
  // Allowlist the keys from a FRESHLY BUILT element of this type, so the list
  // maintains itself as features are added and anything a file invented is
  // dropped rather than merged into live state.
  const allowed=new Set(Object.keys(base).concat(["id","type"]));
  const filtered={};
  // Allowlisting key NAMES is not enough — a file can carry the right key with the
  // wrong TYPE (a number or object where a colour string belongs), which then reaches
  // hexA()/typeCss and throws mid-render. Require the value to match the shape of the
  // default it is replacing.
  // Recursive: a wrong type NESTED inside (style.text.color as an object rather than a
  // colour string) is just as damaging as one at the top, and reaches hexA()/typeCss.
  const coerce=(v,tmpl)=>{
    if(tmpl===undefined||tmpl===null)return undefined;          // nothing to match -> drop
    if(Array.isArray(tmpl))return Array.isArray(v)?v:undefined;
    if(typeof tmpl==="object"){
      if(!v||typeof v!=="object"||Array.isArray(v))return undefined;
      const o={}; let any=false;
      Object.keys(v).forEach(k=>{ const c=coerce(v[k],tmpl[k]); if(c!==undefined){o[k]=c;any=true;} });
      return any?o:undefined;
    }
    return (typeof v===typeof tmpl)?v:undefined;                // primitive must match
  };
  Object.keys(raw).forEach(k=>{
    if(!allowed.has(k))return;
    if(k==="id"||k==="type"){ filtered[k]=raw[k]; return; }
    const c=coerce(raw[k],base[k]);
    if(c!==undefined) filtered[k]=c;
  });
  const e=deepMerge(base,filtered);
  e.type=raw.type; e.id=uid();                          // always re-id: incoming ids can collide
  return e;
}
// Re-issuing ids breaks cross-references, so remap them together and drop any that
// dangle — a dangling visWith/dock.to hides an element forever with no way to fix
// it from the inspector.
// Returns the elements, and hangs the old->new id map off the array so callers can
// remap anything ELSE that referenced those ids (rules[].target).
function sanitizeElements(list){
  const out=[];
  // Object.create(null): a plain {} would let an element whose id is "constructor" or
  // "toString" resolve against Object.prototype and remap to garbage.
  const map=Object.create(null);
  (Array.isArray(list)?list:[]).forEach(r=>{ const e=sanitizeElement(r); if(e){ if(r&&r.id)map[r.id]=e.id; out.push(e); } });
  out.forEach(e=>{
    if(e.visWith){ if(map[e.visWith])e.visWith=map[e.visWith]; else { delete e.visWith; if(e.vis==="linked")e.vis="normal"; } }
    if(e.dock&&e.dock.to){ if(map[e.dock.to])e.dock.to=map[e.dock.to]; else { e.dock.to=null; e.dock.on=false; } }
  });
  out.idMap=map;
  return out;
}
// Rules point at element ids, and import re-issues every id — without this every
// automation rule in an imported look silently aimed at an id that no longer exists,
// and the panel's dropdown auto-selected the first element so it LOOKED wired up.
function remapRules(rules,map){
  if(!Array.isArray(rules))return [];
  return rules.map(r=>{
    if(!r||typeof r!=="object")return null;
    const out=Object.assign({},r);
    out.id=uid();
    if(out.target&&map&&map[out.target])out.target=map[out.target];
    else out.target=null;               // dangling -> panel shows "(pick an element)"
    return out;
  }).filter(Boolean);
}
function sanitizeLibrary(raw){
  const folders=[];
  (Array.isArray(raw)?raw:[]).forEach(f=>{
    if(!f||typeof f!=="object")return;
    const items=[];
    (Array.isArray(f.items)?f.items:[]).forEach(it=>{
      if(!it||typeof it!=="object"||!it.config)return;
      const cfg=deepMerge(defaultConfig(),it.config);
      const els=sanitizeElements(it.config.elements);
      cfg.elements=els;
      cfg.rules=remapRules(it.config.rules,els.idMap);    // rules must follow the new ids
      delete cfg.conn;                                   // never carry another machine's ProPresenter IP
      items.push({id:uid(),name:String(it.name||"Preset").slice(0,80),config:cfg});
    });
    folders.push({id:uid(),name:String(f.name||"Folder").slice(0,60),items});
  });
  return folders;
}

// -> {ok:true, kind, payload} | {ok:false, error}
function parseGfx(text){
  let p; try{ p=JSON.parse(text); }catch(e){ return {ok:false,error:"That isn't a valid JSON file."}; }
  if(!p||typeof p!=="object") return {ok:false,error:"That file doesn't contain a graphic."};
  if(p.format && p.format!==GFX_FORMAT) return {ok:false,error:"That file was made by a different app ("+String(p.format).slice(0,40)+")."};
  if(p.version && Number(p.version)>GFX_VERSION) return {ok:false,error:"That file was made by a newer version of this app. Update, then try again."};

  if(p.kind==="element"||(!p.kind&&p.element)){
    const e=sanitizeElement(p.element);
    return e?{ok:true,kind:"element",payload:e}:{ok:false,error:"That element file has no recognisable element type."};
  }
  if(p.kind==="look"||(!p.kind&&p.config&&p.config.elements)){
    const src=p.config||{};
    const cfg=deepMerge(defaultConfig(),src);
    const els=sanitizeElements(src.elements);
    cfg.elements=els;
    cfg.rules=remapRules(src.rules,els.idMap);        // rules must follow the new ids
    delete cfg.conn;
    if(!cfg.elements.length) return {ok:false,error:"That look file has no usable elements."};
    return {ok:true,kind:"look",payload:{name:String(p.name||"Imported look").slice(0,80),config:cfg}};
  }
  // library — the new envelope, or the legacy bare {folders:[...]} export
  const rawFolders=(p.folders!==undefined)?p.folders:null;
  if(rawFolders!==null){
    if(!Array.isArray(rawFolders)) return {ok:false,error:"That preset file is malformed (folders isn't a list)."};
    const folders=sanitizeLibrary(rawFolders);
    if(!folders.length) return {ok:false,error:"That preset file has no usable folders."};
    return {ok:true,kind:"library",payload:folders};
  }
  return {ok:false,error:"That file doesn't look like a graphic, look, or preset library."};
}

/* ------------------------------------------------------------------- askText
   Electron does NOT implement window.prompt — it is a no-op that logs an error.
   Every "name this preset / folder" flow used prompt(), so in the PACKAGED app
   those buttons silently did nothing while working fine in a browser. This is a
   real in-page dialog, so naming works everywhere.
   Returns a Promise<string|null>; null means the operator cancelled. */
function askText(label,def,okLabel){
  return new Promise((resolve)=>{
    let done=false;
    const back=el("div",{class:"lt-ask",role:"dialog","aria-modal":"true",
      style:"position:fixed;inset:0;z-index:2147483646;background:rgba(4,8,16,.62);"+
      "display:flex;align-items:center;justify-content:center;font-family:'Inter',system-ui,Segoe UI,Arial,sans-serif"});
    const box=el("div",{style:"min-width:340px;max-width:90vw;background:#121a2b;border:1px solid #2b3a5e;"+
      "border-radius:12px;padding:16px 16px 14px;box-shadow:0 24px 70px rgba(0,0,0,.55)"});
    const h=el("div",{style:"font-size:13px;font-weight:700;color:#eef3fb;margin-bottom:10px"});
    h.append(document.createTextNode(String(label||"Enter a value")));
    const inp=el("input",{type:"text",value:def==null?"":String(def),
      style:"width:100%;box-sizing:border-box;background:#0b1220;border:1px solid #2b3a5e;border-radius:8px;"+
            "color:#eef3fb;font-size:13px;padding:8px 10px;outline:none"});
    const row=el("div",{style:"display:flex;gap:8px;justify-content:flex-end;margin-top:12px"});
    const cancel=el("button",{class:"btn sm","data-ask":"cancel",text:"Cancel"});
    const okb=el("button",{class:"btn sm primary","data-ask":"ok",text:okLabel||"OK"});
    row.append(cancel,okb); box.append(h,inp,row); back.append(box);

    function finish(v){
      if(done)return; done=true;
      document.removeEventListener("keydown",onKey,true);
      try{ back.remove(); }catch(e){}
      resolve(v);
    }
    function onKey(e){
      if(e.key==="Escape"){ e.preventDefault(); finish(null); }
      else if(e.key==="Enter"){ e.preventDefault(); finish(inp.value.trim()||null); }
    }
    okb.onclick=()=>finish(inp.value.trim()||null);
    cancel.onclick=()=>finish(null);
    // Click-away cancels only if the press STARTED on the backdrop. Using click alone
    // meant selecting text in the field and releasing outside discarded the name the
    // operator was part-way through typing.
    let downOnBack=false;
    back.addEventListener("mousedown",(e)=>{ downOnBack=(e.target===back); });
    back.onclick=(e)=>{ if(e.target===back && downOnBack) finish(null); };
    document.addEventListener("keydown",onKey,true);
    document.body.appendChild(back);
    setTimeout(()=>{ try{ inp.focus(); inp.select(); }catch(e){} },0);
  });
}

function gfxSave(obj,filename){
  try{
    const blob=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=el("a",{href:url,download:filename}); document.body.appendChild(a); a.click();
    setTimeout(()=>{ try{URL.revokeObjectURL(url); a.remove();}catch(e){} },1000);   // don't leak blob URLs
  }catch(e){ alert("Couldn't save the file: "+(e&&e.message||e)); }
}

/* ============================================================= SCRIPTURE PARSER */
const BOOKS=("Genesis|Exodus|Leviticus|Numbers|Deuteronomy|Joshua|Judges|Ruth|1 Samuel|2 Samuel|"+
 "1 Kings|2 Kings|1 Chronicles|2 Chronicles|Ezra|Nehemiah|Esther|Job|Psalms|Psalm|Proverbs|"+
 "Ecclesiastes|Song of Solomon|Song of Songs|Isaiah|Jeremiah|Lamentations|Ezekiel|Daniel|Hosea|"+
 "Joel|Amos|Obadiah|Jonah|Micah|Nahum|Habakkuk|Zephaniah|Haggai|Zechariah|Malachi|Matthew|Mark|"+
 "Luke|John|Acts|Romans|1 Corinthians|2 Corinthians|Galatians|Ephesians|Philippians|Colossians|"+
 "1 Thessalonians|2 Thessalonians|1 Timothy|2 Timothy|Titus|Philemon|Hebrews|James|1 Peter|2 Peter|"+
 "1 John|2 John|3 John|Jude|Revelation|Gen|Exod|Lev|Num|Deut|Josh|Judg|1 Sam|2 Sam|1 Kgs|2 Kgs|"+
 "1 Chr|2 Chr|Neh|Est|Pss|Ps|Prov|Eccl|Isa|Jer|Lam|Ezek|Dan|Hos|Obad|Jon|Mic|Nah|Hab|Zeph|Hag|"+
 "Zech|Mal|Matt|Mt|Mk|Lk|Jn|Rom|1 Cor|2 Cor|Gal|Eph|Phil|Col|1 Thess|2 Thess|1 Tim|2 Tim|Tit|"+
 "Phlm|Heb|Jas|1 Pet|2 Pet|1 Jn|2 Jn|3 Jn|Rev").split("|").map(s=>s.trim());
BOOKS.sort((a,b)=>b.length-a.length);
const BOOK_RE=BOOKS.map(b=>b.replace(/ /g,"\\s+").replace(/\./g,"\\.")).join("|");
// The range tail accepts a bare verse (3:16-18) OR a second chapter:verse (1:1-2:3).
// Without the cross-chapter branch the match stopped after "1:1-2" and the leftover ":3"
// was painted at the START of the verse body on air.
const REF_CORE="((?:"+BOOK_RE+")\\.?)\\s+(\\d+)\\s*[:.]\\s*(\\d+)(?:\\s*[\\-\\u2013\\u2014]\\s*(\\d+(?:\\s*[:.]\\s*\\d+)?))?";
// \d{0,2}, not \d? — real tags carry two digits (NASB95, NIV84). With one digit the regex
// consumed "NASB9" and left the stray "5" glued to the front of the verse body.
const TR_RE="(?:\\s*\\(?([A-Z]{2,6}\\d{0,2})\\)?)?";
const REF_FULL=new RegExp("\\b"+REF_CORE+TR_RE,"i");
const REF_LINE=new RegExp("^\\s*"+REF_CORE+TR_RE+"\\s*$","i");
const REF_CORE_ONLY=new RegExp("\\b"+REF_CORE,"i");   // reference without the optional translation tag
// A real translation tag is UPPERCASE (KJV, NIV, ESV, NASB95). The reference regexes are
// case-insensitive, so [A-Z]{2,6} also matches lowercase — without this guard the parser
// eats the first verse word (e.g. "John 3:16 For God..." -> tag "For", body "God...").
function isTr(s){ return !!s && /^[A-Z]{2,6}\d{0,2}$/.test(s); }
function tidyRef(m){let book=m[1].replace(/\s+/g," ").replace(/\.$/,"");
  // m[4] is either "18" or a cross-chapter "2:3" (possibly spaced) — normalise the separator.
  let r=book+" "+m[2]+":"+m[3]; if(m[4])r+="-"+String(m[4]).replace(/\s*[:.]\s*/,":").replace(/\s+/g,""); return r;}
function parseScripture(text){
  if(!text)return null; const raw=text.replace(/\r/g,""); const lines=raw.split("\n");
  for(let i=0;i<lines.length;i++){const m=lines[i].match(REF_LINE);
    if(m){const tr=isTr(m[5])?m[5]:"";
      const rest=lines.slice(0,i).concat(lines.slice(i+1)).join("\n").trim();
      return {ref:tidyRef(m),translation:tr,body:rest,rawText:raw.trim()};}}
  const m=raw.match(REF_FULL);
  if(m){const tr=isTr(m[5])?m[5]:"";
    // when m[5] isn't a real (uppercase) tag it's actually the first body word —
    // strip only the reference itself so that word stays in the body.
    const refSpan=tr?m[0]:(raw.match(REF_CORE_ONLY)||[m[0]])[0];
    const body=raw.replace(refSpan,"").replace(/\s{2,}/g," ").trim();
    return {ref:tidyRef(m),translation:tr,body,rawText:raw.trim()};}
  return null;
}

/* ============================================================= PERSISTENCE + BUS */
const LS_PROGRAM="pplt.program.v2", LS_PREVIEW="pplt.preview.v2", LS_PRESETS="pplt.presets.v2";
const RELAY_PORT=7777;
function lsGet(k,fb){try{const r=localStorage.getItem(k);return r?deepMerge(fb,JSON.parse(r)):clone(fb);}catch(e){return clone(fb);}}
// A silent failure here is the worst kind: the operator keeps designing, nothing is
// ever persisted, and the work is gone on reload. Surface it once (not per keystroke).
let _lsWarned=false;
function lsSet(k,v){
  try{ localStorage.setItem(k,JSON.stringify(v)); _lsWarned=false; }
  catch(e){
    if(!_lsWarned){
      _lsWarned=true;
      try{ console.error("lower-thirds: could not save — local storage is full",e); }catch(e2){}
      try{ if(typeof alert==="function") alert(
        "Couldn't save your work — this browser's local storage is full.\n\n"+
        "The most common cause is an imported image or video embedded in the look. "+
        "Remove it, or host it and paste the URL instead.\n\n"+
        "Until then, changes will NOT survive a reload."); }catch(e2){}
    }
  }
}
/* A try/catch around JSON.parse only survives INVALID JSON. Valid JSON of the WRONG SHAPE
   ({"folders":"oops"}, [], null, 42) sailed straight through and then threw on the first
   presets.folders.forEach() during boot — killing the entire console: both monitors blank,
   ProPresenter never connects, and no UI left to recover with. And it repeats on every
   launch, because the bad value is still sitting in localStorage. Validate the shape. */
function loadPresets(){
  const fallback=()=>({folders:[{id:uid(),name:"My Presets",items:[]}]});
  let raw=null;
  try{ raw=localStorage.getItem(LS_PRESETS); }catch(e){ return fallback(); }
  if(!raw) return fallback();
  let p=null;
  try{ p=JSON.parse(raw); }catch(e){ return fallback(); }
  if(!p||typeof p!=="object"||Array.isArray(p)||!Array.isArray(p.folders)) return fallback();
  p.folders=p.folders.filter(f=>f&&typeof f==="object"&&!Array.isArray(f)).map(f=>({
    id:f.id||uid(),
    name:String(f.name||"Folder").slice(0,60),
    items:Array.isArray(f.items)?f.items.filter(it=>it&&typeof it==="object"&&!Array.isArray(it)):[]
  }));
  if(!p.folders.length) return fallback();
  return p;
}
function savePresets(p){lsSet(LS_PRESETS,p);}

// served by relay over http(s); standalone over file://
const SERVED=location.protocol!=="file:";
function relayBase(){ return SERVED? location.origin : ("http://localhost:"+RELAY_PORT); }

/* Polls bound data sources through the relay's /fetch proxy and hands back a flat
   {name:value} map. Each source keeps its own interval, a failure never clears the
   last good values (a blip must not blank a graphic), and everything is torn down
   on setSources so a config change can't leak timers. */
function createDataFeed(onVars){
  let srcs=[],timers=[],gen=0,debounce=null;
  // Values are kept PER SOURCE and recombined, so disabling or deleting a source
  // actually drops its values. A single flat map meant a removed source's values
  // stayed bound and kept rendering on air.
  let bySrc=Object.create(null);
  const status={};
  function combine(){
    const out=Object.create(null);
    srcs.forEach(s=>{ const v=bySrc[s.id]; if(!v)return;
      Object.keys(v).forEach(k=>{ out[k]=v[k]; if(s.name)out[s.name+"."+k]=v[k]; }); });
    return out;
  }
  const emit=()=>{ try{ onVars&&onVars(combine(),status); }catch(e){} };
  function fetchOne(s,my){
    if(!s||!s.url||s.enabled===false)return Promise.resolve();
    const u=relayBase()+"/fetch?target="+encodeURIComponent(s.url);
    return fetch(u,{cache:"no-store"})
      .then(r=>r.ok?r.text():Promise.reject(new Error("HTTP "+r.status)))
      .then(t=>{
        // An in-flight fetch from a previous source list must not resurrect values
        // after the operator deleted or edited the source.
        if(my!==gen)return;
        const got=parseDataSource(s.kind||"csv",t,s.pick,s.layout);
        const n=Object.keys(got).length;
        if(!n){ status[s.id]={ok:false,msg:"fetched, but no values found"}; emit(); return; }
        bySrc[s.id]=got;
        status[s.id]={ok:true,msg:n+" value"+(n===1?"":"s")};
        emit();
      })
      .catch(e=>{ if(my!==gen)return;
        // keep the last good values for THIS source — a blip must not blank a graphic
        status[s.id]={ok:false,msg:String((e&&e.message)||e)}; emit(); });
  }
  function stop(){ timers.forEach(t=>clearInterval(t)); timers=[]; if(debounce){clearTimeout(debounce);debounce=null;} gen++; }
  function setSources(list){
    stop();
    const next=(Array.isArray(list)?list:[]).filter(s=>s&&s.url);
    // drop values for sources that are gone or now disabled
    const live=new Set(next.filter(s=>s.enabled!==false).map(s=>s.id));
    Object.keys(bySrc).forEach(id=>{ if(!live.has(id))delete bySrc[id]; });
    Object.keys(status).forEach(id=>{ if(!live.has(id))delete status[id]; });
    srcs=next;
    const my=gen;
    // Debounce the first fetch: setSources runs on every keystroke and every slider
    // step while editing a source, and firing immediately each time hammered the
    // endpoint straight past the 5s floor.
    debounce=setTimeout(()=>{ if(my!==gen)return; srcs.forEach(s=>fetchOne(s,my)); },400);
    srcs.forEach(s=>{
      const ms=Math.max(5,Number(s.interval)||60)*1000;   // never hammer: 5s floor
      timers.push(setInterval(()=>{ if(my===gen)fetchOne(s,my); },ms));
    });
    emit();                                   // reflect removals immediately
  }
  return { setSources, stop, refresh(){ const my=gen; srcs.forEach(s=>fetchOne(s,my)); },
           vars(){ return combine(); }, status(){ return status; } };
}

function createBus(){
  let onProg=null, es=null, relayOk=false, statusCb=null;
  let bc=null; try{bc=new BroadcastChannel("pplt");}catch(e){}
  function connectSSE(){
    try{
      // Declare which kind of client this is. The console subscribes to /events too,
      // so without a role the relay would count the console as a connected output and
      // the OBS lamp would read green with nothing actually on air.
      es=new EventSource(relayBase()+"/events?role="+(isOutputMode()?"output":"console"));
      es.onmessage=(ev)=>{ try{const d=JSON.parse(ev.data); if(d&&d.type==="program"&&onProg)onProg(d.cfg);}catch(e){} };
      es.onopen=()=>{ relayOk=true; statusCb&&statusCb(true); };
      es.onerror=()=>{ relayOk=false; statusCb&&statusCb(false); };
    }catch(e){ relayOk=false; statusCb&&statusCb(false); }
  }
  if(bc) bc.onmessage=(ev)=>{ const d=ev.data||{}; if(d.type==="program"&&onProg)onProg(d.cfg); };
  return {
    onStatus(cb){statusCb=cb;},
    subscribe(cb){ onProg=cb; connectSSE(); },
    publish(cfg){
      lsSet(LS_PROGRAM,cfg);
      if(bc)bc.postMessage({type:"program",cfg});
      // A resolved fetch is NOT a successful Take. The relay answers 400 on bad JSON,
      // 413 when the config is over the cap and 403 on a refused origin — all of which
      // resolve, so the operator was told "on air" when nothing had been sent.
      fetch(relayBase()+"/config",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify(cfg)})
        .then((r)=>{
          if(r&&r.ok){ relayOk=true; statusCb&&statusCb(true); return; }
          relayOk=false;
          const code=(r&&r.status)||0;
          statusCb&&statusCb(false,code===413
            ?"Take failed: the look is too large to send (over 5 MB). Shrink or unlink an imported image."
            :("Take failed: the local server answered "+code+"."));
        })
        .catch((e)=>{ relayOk=false;
          statusCb&&statusCb(false,"Take failed: the local server is not reachable. Is the app still running?"); });
    },
    isRelay(){return relayOk;}
  };
}

/* ============================================================= PROPRESENTER CLIENT */
function ppUrl(host,port,path){
  const target=`http://${host}:${port}${path}`;
  if(location.protocol==="file:") return target;            // direct
  return relayBase()+"/pp?target="+encodeURIComponent(target); // via relay proxy (no CORS)
}
function slideLayerActive(layers){
  if(layers==null) return null;
  if(layers.data!==undefined) return slideLayerActive(layers.data);
  if(Array.isArray(layers)){
    for(const x of layers){ const nm=(x.name||x.id||x.layer||"").toString().toLowerCase();
      if(nm==="slide"||nm==="slides") return !!(x.status??x.active??x.value??x.on??x.enabled); }
    return null;
  }
  if(typeof layers==="object"){
    if("slide" in layers) return !!layers.slide;
    if("Slide" in layers) return !!layers.Slide;
  }
  return null;
}
// True when EVERY visual layer is inactive (i.e. ProPresenter "Clear All" / F1).
// Audio is ignored (background music doesn't count as on-screen content).
function layerOn(v){ if(typeof v==="boolean")return v;
  if(v&&typeof v==="object")return !!(v.status??v.active??v.value??v.on??v.enabled); return null; }
function allLayersClear(layers){
  if(layers==null) return null;
  if(layers.data!==undefined) return allLayersClear(layers.data);
  let any=false, active=false;
  const consider=(nm,v)=>{ if((nm||"").toString().toLowerCase()==="audio")return;
    const on=layerOn(v); if(on===null)return; any=true; if(on)active=true; };
  if(Array.isArray(layers)){ layers.forEach(x=>consider(x.name||x.id||x.layer,x)); }
  else if(typeof layers==="object"){ for(const k in layers)consider(k,layers[k]); }
  if(!any) return null;        // shape not understood
  return !active;              // true = all visual layers off = Clear All
}
// Normalize ProPresenter's layer status into a flat {layerName: bool} map
// (handles the flat-object shape and array/data-wrapped variants).
function normLayers(layers){
  if(layers==null) return null;
  if(layers.data!==undefined) return normLayers(layers.data);
  const out={};
  if(Array.isArray(layers)){ layers.forEach(x=>{ const nm=(x.name||x.id||x.layer||"").toString().toLowerCase(); if(nm){ const on=layerOn(x); if(on!==null) out[nm]=on; } }); }
  else if(typeof layers==="object"){ for(const k in layers){ const on=layerOn(layers[k]); if(on!==null) out[k.toLowerCase()]=on; } }
  return out;
}
// Decide whether a clear event should wipe the scripture reference list, per the
// operator's chosen rule. Evaluated only while the slide is in a cleared state.
function isFullClear(rule, layer, signals){
  if(!signals) return false;
  switch(rule){
    case "manual": return false;
    case "pres":   return signals.presPopulated===false;          // ProPresenter cleared the active presentation (Clear All)
    case "layer":  { const m=signals.layers||{}; return m[layer]===false; }  // the chosen distinguishing layer went off
    case "all":
    default:       return signals.allOff===true;                  // every visual layer off
  }
}
function createPP(opts){
  let host,port,pollMs,timer=null,running=false,lastKey="",lastSigKey="",supportsLayers=true;
  let lastActive=null,lastAllClr=null,lastLayers=null,lastPres=null;
  // Every connect() bumps the generation. A tick that was mid-await when the
  // operator hit "Connect / reconnect" belongs to an older generation and must
  // die instead of scheduling another timer — otherwise each reconnect FORKED a
  // second poll loop, and the stale one could repaint a previous verse on air.
  let gen=0;
  let wantTimers=false;      // set true only while a clock element mirrors a PP timer
  // A layers payload we don't recognise used to latch layer support off for the
  // whole session on ONE bad read (a {} body, a 200-with-error, a PP hiccup), and
  // clear detection never came back. Require several in a row.
  let unknownLayers=0;
  const UNKNOWN_LAYERS_LIMIT=3;

  // No timeout on a fetch means one request that never settles stalls the feed
  // forever while the console still says "Connected". Abort well inside the poll
  // cadence and just retry.
  async function ppGet(path,signal){
    return fetch(ppUrl(host,port,path),{cache:"no-store",signal});
  }

  async function tick(myGen){
    if(!running || myGen!==gen) return;
    const ctl=(typeof AbortController!=="undefined")?new AbortController():null;
    const sig=ctl?ctl.signal:undefined;
    const watchdog=setTimeout(()=>{ try{ ctl&&ctl.abort(); }catch(e){} }, Math.max(2000,(pollMs||200)*8));
    try{
      let slideText="",active=null,allClr=null,slideOk=false,layersMap=lastLayers,presPop=lastPres;
      try{
        const r=await ppGet("/v1/status/slide",sig);
        if(r.ok){ const d=await r.json(); const dd=(d&&d.data&&(d.current||d.next)?d:(d.data||d));
          const cur=dd&&dd.current; slideText=cur&&cur.text!=null?cur.text:""; slideOk=true; opts.onReach&&opts.onReach(true); }
        else { opts.onReach&&opts.onReach(false); }
      }catch(e){ opts.onReach&&opts.onReach(false,e); }
      if(!running || myGen!==gen) return;
      // A failed slide poll (network blip / PP busy) must NOT blank the on-air verse:
      // hold the last good state and try again next tick.
      if(!slideOk){ return; }
      if(supportsLayers){
        let layerOkThisTick=false;
        try{ const lr=await ppGet("/v1/status/layers",sig);
          if(lr.ok){ const lj=await lr.json(); const a=slideLayerActive(lj);
            if(a===null){ if(++unknownLayers>=UNKNOWN_LAYERS_LIMIT) supportsLayers=false; }
            else { unknownLayers=0; active=a; allClr=allLayersClear(lj); layersMap=normLayers(lj); lastActive=active; lastAllClr=allClr; lastLayers=layersMap; layerOkThisTick=true; } }
          // a non-ok layers status is transient — do NOT latch supportsLayers off
        }catch(e){ /* transient layers failure — do NOT latch off; retry next tick */ }
        if(!running || myGen!==gen) return;
        // on a transient layers miss, reuse the last good reading instead of flapping
        if(supportsLayers && !layerOkThisTick){ active=lastActive; allClr=lastAllClr; layersMap=lastLayers; }
      }
      // presentation/active distinguishes Clear All (presentation cleared -> null) from
      // Clear Slide (slide hidden but the presentation stays active -> populated). Hold last on a blip.
      try{ const pr=await ppGet("/v1/presentation/active",sig);
        if(pr.ok){ const pj=await pr.json(); const pd=(pj&&pj.data)||pj||{}; presPop=(pd.presentation!=null); lastPres=presPop; }
      }catch(e){ /* transient — hold last */ }
      if(!running || myGen!==gen) return;
      // Timers are only polled when a clock element is actually mirroring one, so
      // the common config pays nothing for this.
      if(wantTimers){
        // /v1/timers returns the timer DEFINITIONS (countdown.duration etc) — polling
        // that showed a frozen configured value instead of a running clock. The LIVE
        // values are on /v1/timers/current: [{id:{name,index,uuid}, time:"00:05:00",
        // state:"stopped"|"running"}]. Verified against ProPresenter 21.2.
        try{ const tr=await ppGet("/v1/timers/current",sig);
          if(tr.ok){ const tj=await tr.json();
            // null (not []) when the body is a shape we don't recognise. Falling back to []
            // meant a 200 with an unexpected envelope — a keyed object map on some PP build,
            // or an error envelope during a hiccup — reported "no timers" and pulled the
            // countdown OFF AIR, while a hard 404 correctly held the last value. The worse
            // failure degraded gracefully and the milder one didn't; now both hold.
            // A recognised but EMPTY array still passes through: that legitimately means
            // "this rig has no timers".
            const arr=Array.isArray(tj)?tj:(Array.isArray(tj&&tj.data)?tj.data:(Array.isArray(tj&&tj.timers)?tj.timers:null));
            if(arr){ try{ opts.onTimers && opts.onTimers(arr); }catch(e){} } }
        }catch(e){ /* transient — keep the last known timers */ }
        if(!running || myGen!==gen) return;
      }
      // clear when layer inactive (preferred) OR no text;  clearAll = every visual layer off (F1)
      const cleared = (active===false) || (active===null && !slideText.trim());
      const clearAll = (allClr===true);
      const signals = { layers:layersMap, presPopulated:presPop, allOff:clearAll };
      const sigKey = active+"|"+presPop+"|"+JSON.stringify(layersMap||0);
      // Callback exceptions are contained: a render error must never stop the feed.
      if(sigKey!==lastSigKey){ lastSigKey=sigKey; try{ opts.onSignals && opts.onSignals(signals); }catch(e){} }
      const key=(cleared?"__CLEAR__":slideText)+"|"+active+"|"+clearAll+"|"+presPop;
      if(key!==lastKey){ lastKey=key; try{ opts.onUpdate(cleared?"":slideText, active, clearAll, signals); }catch(e){} }
    }catch(e){
      /* nothing above may kill the loop — the finally below always re-arms */
    }finally{
      clearTimeout(watchdog);
      if(running && myGen===gen) timer=setTimeout(()=>tick(myGen),pollMs);
    }
  }
  return {
    connect(h,p,ms){ this.stop(); host=h;port=p;pollMs=ms||200;running=true;supportsLayers=true;unknownLayers=0;
      lastKey="";lastSigKey="";lastActive=null;lastAllClr=null;lastLayers=null;lastPres=null;
      const myGen=++gen; tick(myGen); },
    stop(){ running=false; gen++; if(timer){clearTimeout(timer);timer=null;} },
    setWantTimers(b){ wantTimers=!!b; },
    layersSupported(){return supportsLayers;}
  };
}

/* ============================================================= RENDERER */
function makeElRenderer(){
  const root=el("div",{class:"lt-el"});
  const box=el("div",{class:"lt-box"});
  const media=el("div",{class:"lt-media"});
  const scrim=el("div",{class:"lt-scrim"});
  const accent=el("span",{class:"lt-accent"});
  const content=el("div",{class:"lt-content"});
  const shine=el("div",{class:"lt-shine"}); const gleam=el("div",{class:"gleam"}); shine.append(gleam);
  box.append(media,scrim,accent,content,shine); root.append(box);

  let layoutSig="",layoutClearT=null;

    // timer fired mid-flight through the next move and stripped the transition, so a
    // second dock move (e.g. a clear while a dock was still gliding) snapped instead
    // of easing.
    if(layoutClearT){ clearTimeout(layoutClearT); layoutClearT=null; }

      root.style.transition=`left ${ms}ms ${ease},top ${ms}ms ${ease},width ${ms}ms ${ease},height ${ms}ms ${ease}`;
      root.style.left=L.x+"px"; root.style.top=L.y+"px"; root.style.width=L.w+"px"; root.style.height=L.h+"px";
      layoutClearT=setTimeout(()=>{ layoutClearT=null;

    const kind=isVid?"video":"image";

    if(shape==="parallelogramR")return "polygon(0 0, 93% 0, 100% 100%, 7% 100%)";

    } else {
      node.classList.remove("clamp");
      node.style.webkitLineClamp="";
      if(node.style.display==="-webkit-box")node.style.display="block";

  function esc(s){return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

  // operator's typed verse in d.content — but the live feed supplies it via `data`.
  // Return d.content ONLY for a manual element: falling back on a LIVE one would paint a
  // stale default reference next to a live verse body. Null means "no fallback allowed".

function createStage(scaler,opts){

      return {items:lines.map((t,i)=>({id:"m"+i,ref:t}))}; }

    // slide (a sermon point, a looping announcement) that is indefinitely.

function fitScaler(scaler,container){ const cw=container.clientWidth,ch=container.clientHeight;
  const s=Math.min(cw/STAGE_W,ch/STAGE_H); scaler.style.transform=`translate(-50%,-50%) scale(${s})`; return s; }

/* ============================================================= MODE SWITCH */
// Function declaration (hoisted) so createBus() can use it before this line runs.
function isOutputMode(){ return /(^|[?&])view=output/.test(location.search) || /(^|#)output/.test(location.hash) || /\/output\/?$/.test(location.pathname); }
const isOutput = isOutputMode();

function applyBg(rootEl,bg){ rootEl.classList.remove("bg-green","bg-black","green","black");
  if(bg==="green")rootEl.classList.add(rootEl===document.body?"bg-green":"green");
  if(bg==="black")rootEl.classList.add(rootEl===document.body?"bg-black":"black"); }

/* ============================================================= OUTPUT BOOTSTRAP */
if(isOutput){

  const scaler=$("out-scaler"), rootStage=$("output-root");
  const stage=createStage(scaler,{interactive:false});
  function readHashCfg(){ const m=(location.hash||"").match(/[#&]cfg=([^&]+)/); if(!m)return null;
    try{ return JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1]))))); }catch(e){ return null; } }
  const hashCfg=readHashCfg();
  let program = migrateLayout(migrateClearRule(hashCfg ? deepMerge(defaultConfig(),hashCfg) : lsGet(LS_PROGRAM,defaultConfig())));
  applyBg(document.body,program.out.bg); stage.setConfig(program);
  let lastTake=program._take||0, lastClearHist=program._clearHist||0;

    // setHeaderHold(true), so ANY text on air — a worship-song lyric, a sermon point, an
    // announcement — put an empty "Previously Referenced" plate on air and left it there for
    // the whole set. Only an actual scripture reference opens the list.

/* ============================================================= CONSOLE BOOTSTRAP */
if(!isOutput){

    // unconditionally the moment the button was pressed, so a refused publish still read
    // "ON AIR" while OBS showed the previous look.

        setTimeout(()=>b.classList.remove("flashfail"),2500); } }
    }

      split(rowToggle("Border",b.border,(v)=>{b.border=v;onCh();}),

  function importMedia(file,cb){
    const isImg=/^image\//.test(file.type), isGif=/gif$/i.test(file.type), isVid=/^video\//.test(file.type);
    if(isImg&&!isGif&&window.FileReader&&document.createElement("canvas").getContext){
      const fr=new FileReader();
      fr.onload=()=>{ const img=new Image();
        img.onload=()=>{ const max=1600; let w=img.width||0,h=img.height||0;
          const sc=Math.min(1,max/Math.max(w,h||1)); const cw=Math.max(1,Math.round(w*sc)),ch=Math.max(1,Math.round(h*sc));
          const cv=document.createElement("canvas"); cv.width=cw; cv.height=ch; const ctx=cv.getContext("2d");
          if(!ctx){ cb(fr.result,"image"); return; }
          ctx.drawImage(img,0,0,cw,ch);
          const png=/png$/i.test(file.type)||/^image\/png/.test(file.type);
          try{ cb(cv.toDataURL(png?"image/png":"image/jpeg",0.85),"image"); }catch(e){ cb(fr.result,"image"); } };
        img.onerror=()=>cb(fr.result,"image"); img.src=fr.result; };
      fr.readAsDataURL(file);
    } else { const fr=new FileReader(); fr.onload=()=>cb(fr.result,isVid?"video":"image"); fr.readAsDataURL(file); }
  }
  function mediaGroup(b,onCh){
    const hasM=!!b.mediaSrc, isUrl=hasM&&/^https?:/i.test(b.mediaSrc);
    const fileInput=el("input",{type:"file",accept:"image/*,video/*",style:"display:none"});
    fileInput.onchange=()=>{ const f=fileInput.files&&fileInput.files[0]; if(!f)return;
      // Guard EVERY media type, not just video. Media is inlined as a base64 data
      // URI into the config, and that config is stored three times over in
      // localStorage and POSTed to the relay (5 MB cap). An unguarded large image
      // silently blew the quota, so saves stopped persisting and Take never
      // reached OBS while the console still said ON AIR.
      // GIFs skip the canvas downscaler (it would kill the animation), so they go
      // in at full size and get the same limit as video.
      const isVideo=/^video\//.test(f.type), isGif=/gif$/i.test(f.type);
      const cap=(isVideo||isGif)?8:12;                 // MB — stills are downscaled to 1600px first
      if(f.size>cap*1024*1024){
        alert("That "+(isVideo?"video":isGif?"GIF":"image")+" is "+(f.size/1048576).toFixed(1)+" MB.\n\n"+
              "Media is embedded in the show file, so anything this large can exceed local storage "+
              "and stop the output updating.\n\nHost it (a direct link, or a local web server) and "+
              "paste the URL in the “…or paste media URL” field below.");
        fileInput.value=""; return;
      }
      importMedia(f,(url,kind)=>{ b.mediaSrc=url; b.mediaType=kind; onCh(); renderPanels(); }); };
    const rows=[
      el("div",{class:"row"},[
        el("button",{class:"btn sm",style:"flex:1",text:hasM?"Replace image / video\u2026":"Import image / video\u2026",onclick:()=>fileInput.click()}),
        hasM?el("button",{class:"btn sm danger",text:"Remove",onclick:()=>{b.mediaSrc="";b.mediaType="";onCh();renderPanels();}}):null
      ]),
      fileInput,
      // rowText binds oninput, so calling renderPanels() from the handler destroyed the
      // very field being typed into \u2014 the URL box lost focus after one character and a
      // URL could not be typed or edited at all. Update the model on every keystroke
      // (so the preview follows along), but only rebuild the panel on COMMIT \u2014 the
      // change event, i.e. blur or Enter \u2014 which is when the dependent controls (Fit,
      // Zoom, scrim) need to appear.
      (function(){
        const row=rowText("\u2026or paste media URL",isUrl?b.mediaSrc:"",
          (v)=>{const u=v.trim();b.mediaSrc=u;b.mediaType=/\.(mp4|webm|ogv|mov)(\?|$)/i.test(u)?"video":"image";onCh();},
          "https://\u2026  image or mp4");
        const inp=row&&row.querySelector&&row.querySelector("input");
        if(inp) inp.addEventListener("change",()=>renderPanels());
        return row;
      })()
    ];
    if(hasM){
      rows.push(rowSelect("Fit",b.mediaFit,[["cover","Fill & crop (cover)"],["contain","Fit inside (contain)"],["stretch","Stretch to fill"],["center","Center (no scale)"],["tile","Tile / repeat"]],(v)=>{b.mediaFit=v;onCh();}));
      rows.push(split(rowRange("Zoom / crop",b.mediaZoom,1,3,0.05,"x",(v)=>{b.mediaZoom=v;onCh();}),
                      rowRange("Media opacity",b.mediaOpacity,0,1,0.02,"",(v)=>{b.mediaOpacity=v;onCh();})));
      rows.push(split(rowRange("Focal X",b.mediaX,0,100,1,"%",(v)=>{b.mediaX=v;onCh();}),
                      rowRange("Focal Y",b.mediaY,0,100,1,"%",(v)=>{b.mediaY=v;onCh();})));
      rows.push(split(rowRange("Dark scrim",b.scrim,0,0.85,0.02,"",(v)=>{b.scrim=v;onCh();}),
                      rowColor("Scrim color",b.scrimColor,(v)=>{b.scrimColor=v;onCh();})));
    }
    return group("Background image / video",rows);
  }

    const list=(pvStage&&pvStage.cfg&&pvStage.cfg.elements||preview.elements||[]).filter(e=>e&&e.id!==d.id);

                      rowRange("Docked Y",dk.y,0,STAGE_H,1,"",(v)=>{dk.y=v;onCh();})));
      rows.push(split(rowRange("Docked W",dk.w,80,STAGE_W,1,"",(v)=>{dk.w=v;onCh();}),
                      rowRange("Docked H",dk.h,50,STAGE_H,1,"",(v)=>{dk.h=v;onCh();})));
      rows.push(el("div",{class:"row"},[
        el("button",{class:"btn ghost sm full",text:"Set docked position = where it is now",onclick:()=>{dk.x=d.layout.x;dk.y=d.layout.y;dk.w=d.layout.w;dk.h=d.layout.h;onCh();renderPanels();}})

  function motionGroup(d,onCh){
    const lp=d.loop||(d.loop=loopDefaults());
    const rows=[ rowSelect("Continuous motion",lp.type,[
      ["none","None (static)"],["pulse","Pulse / breathe"],["glow","Glow pulse"],
      ["float","Float / drift"],["sway","Sway"],["spin","Spin"],["shine","Shine sweep"],
      ["gradientShift","Gradient shift"],["ticker","Ticker \u2014 banner scroll"],["rollV","Credits roll \u2191"]],
      (v)=>{lp.type=v;onCh();renderPanels();}) ];
    if(lp.type!=="none"){
      const fast=(lp.type==="ticker"||lp.type==="rollV"||lp.type==="spin"||lp.type==="shine"||lp.type==="gradientShift");
      const lo=fast?4:1.5, hi=fast?40:12;
      // The two motion families use different speed ranges. Switching type only
      // re-rendered the slider, so a stored 2s carried into the 4-40s range: the thumb
      // pinned to the minimum while the VALUE stayed 2, and the readout disagreed with
      // the motion. Clamp the stored value into the range that now applies.
      if(lp.speed==null||lp.speed<lo||lp.speed>hi){
        lp.speed=Math.max(lo,Math.min(hi,lp.speed==null?(fast?12:6):lp.speed)); onCh(); }
      rows.push(rowRange(fast?"Cycle seconds":"Speed (slower \u2192 faster cycle)",lp.speed,lo,hi,0.5,"s",(v)=>{lp.speed=v;onCh();}));
      if(lp.type==="glow"){
        rows.push(rowSelect("Glow color",lp.colorMode||"accent",[["accent","Match accent bar"],["single","Single color\u2026"],["dual","Two colors\u2026"],["rainbow","Rainbow cycle"]],(v)=>{lp.colorMode=v;onCh();renderPanels();}));
        if(lp.colorMode==="single") rows.push(rowColor("Color",lp.color,(v)=>{lp.color=v;onCh();}));
        if(lp.colorMode==="dual") rows.push(split(rowColor("Color A",lp.color,(v)=>{lp.color=v;onCh();}),rowColor("Color B",lp.color2,(v)=>{lp.color2=v;onCh();})));
        rows.push(rowRange("Glow size",lp.size,2,60,1,"px",(v)=>{lp.size=v;onCh();}));
      }
      if(lp.type==="pulse"||lp.type==="float"||lp.type==="sway")
        rows.push(rowRange("Intensity",lp.intensity,1,40,1,"",(v)=>{lp.intensity=v;onCh();}));
      if(lp.type==="float")
        rows.push(split(rowSelect("Direction",lp.dir,[["left","Left"],["right","Right"],["up","Up"],["down","Down"],["custom","Custom angle"]],(v)=>{lp.dir=v;onCh();renderPanels();}),
                        lp.dir==="custom"?rowRange("Angle",lp.angle,0,360,5,"\u00b0",(v)=>{lp.angle=v;onCh();}):el("span")));
      if(lp.type==="ticker")
        rows.push(rowSeg("Scroll direction",lp.dir==="right"?"right":"left",[["left","\u25c0 Right-to-left"],["right","Left-to-right \u25b6"]],(v)=>{lp.dir=v;onCh();}));
      if(lp.type==="ticker"||lp.type==="rollV")
        rows.push(el("div",{style:"font-size:11.5px;color:var(--faint);line-height:1.5;margin-top:2px",text:"Tip: ticker shows this element's text on a seamless loop. Great for announcements or a scrolling verse. Widen the box for a banner."}));
    }
    return group("Motion / loop",rows);
  }

  function layoutLive(d){ const r=pvStage.getRenderer(d.id); if(r)r.applyLayout(d); savePreview(); }
  function quickPos(d,where){ const L=d.layout;
    if(where==="lower"){L.x=120;L.w=Math.max(L.w,1100);L.h=Math.max(L.h,160);
      // clamp so a tall element (the stock scripture is now h:280) cannot be pushed off the
      // bottom of the 1080 stage; keeps the same 80px margin the default geometry uses
      L.y=Math.min(820,STAGE_H-80-L.h);}
    else if(where==="bl"){L.x=120;L.y=1080-L.h-100;}
    else if(where==="tl"){L.x=120;L.y=80;}
    else if(where==="center"){L.x=Math.round((STAGE_W-L.w)/2);L.y=Math.round((STAGE_H-L.h)/2);}
    applyPreview(); renderPanels(); }
  function testAnim(d){ const r=pvStage.getRenderer(d.id); if(!r)return; r.hide();
    setTimeout(()=>{ let c;
      if(d.type==="history") c={items:liveLog};
      else if(d.type==="eventList"){ const lines=(d.content.items||"").split("\n").map(s=>s.trim()).filter(Boolean); c={items:lines.map((t,i)=>({id:"m"+i,ref:t}))}; }
      else if(d.source&&d.source.kind==="live") c=SAMPLE1; else c={};
      // Stamp the PREVIEW's theme first. This repaints outside renderAll(), so it
      // otherwise resolved brand tokens against whichever stage rendered last — a
      // test animation could flash in Program's colours.
      setCurTheme(preview.theme); setCurVars(cslDataFeed?cslDataFeed.vars():{});
      r.showContent(d,c); },420); }

        el("p",{class:"hint",text:"“Add test verse” is a builder aid — it fills the local log so you can style the list. Only the live ProPresenter feed puts verses on air."})
      ]);
    }

              rowRange("Speed (ms)",d.histDur!=null?d.histDur:450,0,1500,20,"",(v)=>{d.histDur=v;onCh();})),
        el("p",{class:"hint",text:"Adding a line animates just that line in. Editing a line updates it in place."}),
        rowColor("Chip background",d.chipBg||"#0b1220cc",(v)=>{d.chipBg=v;onCh();}),
        rowColor("Accent / bar color",d.accentColor||"#3aa0ff",(v)=>{d.accentColor=v;onCh();}),

      ]);

        d.source.kind==="live"?el("p",{class:"hint",text:"Shown under the name when the live slide has only one line. Leave empty for no role label."}):null,
        typeGroup("Name style",st.name,onCh),
        typeGroup("Title style",st.title,onCh)
      ]);
    }
    if(t==="text"){
      return group("Content",[
        rowSeg("Source",d.source.kind,[["manual","Manual"],["live","Live (raw current slide)"]],(v)=>{d.source.kind=v;onCh();renderPanels();}),
        d.source.kind==="manual"?rowArea("Text",c.text,(v)=>{c.text=v;onCh();}):null,

        rowArea("Link or text",c.text,(v)=>{c.text=v;onCh();},"https://church.example.org/give"),
        el("p",{class:"hint",style:len>213?"color:#ff9d96":"",

        rowSeg("Mode",c.mode||"time",[["time","Time of day"],["countdown","Countdown to"],["pptimer","ProPresenter timer"]],

        c.mode==="pptimer"?rowText("ProPresenter timer name",c.timerName,(v)=>{c.timerName=v;onCh();},"leave blank = first timer"):null,

      el("p",{class:"hint",html:"ProPresenter &rarr; <b>Settings &rarr; Network</b> &rarr; enable, copy IP + port."}),
      rowRange("Poll rate (ms)",cn.pollMs,80,1000,20,"ms",(v)=>{cn.pollMs=v;savePreview();}),
      el("div",{class:"row"},[el("button",{class:"btn primary full",text:"Connect / reconnect",onclick:()=>{startConsolePP();}})]),
      el("div",{class:"grp"},[el("div",{class:"gh",text:"Status"}),

        statLine("Clear detect","stLayer","\u2014")]),
      el("p",{class:"hint",html:"<b>Clear detect</b> reads ProPresenter's slide layer so F1/F2/clear actually hides the graphic. If it shows <i>n/a (text mode)</i>, your build didn't return layer status \u2014 it falls back to empty-text detection."}),
      el("div",{class:"grp"},[el("div",{class:"gh",text:"Clear behavior \u2014 Previously-Referenced list"}),

        rowSeg("Detect a full Clear All by",cn.clearRule||"all",

          (v)=>{cn.clearRule=v;cn._ruleMig=true;cn._ruleMig2=true;savePreview();renderPanels();}),
        (cn.clearRule==="layer")?rowSelect("\u2026this layer turns off",cn.clearLayer||"media",
          [["media","Media"],["props","Props"],["messages","Messages"],["announcements","Announcements"],["video_input","Video input"],["audio","Audio"]],
          (v)=>{cn.clearLayer=v;savePreview();}):null,
        // renderPanels() rebuilds this node empty, so the live readout vanished the

          setTimeout(()=>{ try{ renderClearDiag(); }catch(e){} },0); return n; })(),
        el("div",{class:"row"},[el("button",{class:"btn sm full",text:"Clear scripture list now",onclick:()=>{manualClearList();}})]),
        el("p",{class:"hint",html:"<b>All layers off</b> (recommended) keeps the header up on Clear Slide and removes it on Clear All. Measured on ProPresenter 21.2: Clear Slide leaves <i>media</i> on, Clear All turns everything off — while <i>presentation</i> reports cleared for <b>both</b>, so “Presentation cleared” cannot tell them apart on that build. Use it only if the live readout above shows otherwise on your rig. Changes reach the OBS output after the next <b>Take</b>."})
